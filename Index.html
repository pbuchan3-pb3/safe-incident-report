Incident Date: ${formData.incidentDate||formData.date}
Incident Time: ${formData.incidentTime||formData.time}
Venue: ${formData.venue}
Event: ${formData.eventName||'N/A'}
Location: ${formData.incidentLocation||'N/A'}
Incident Type: ${formData.incidentCategory||'N/A'}
Severity: ${formData.incidentSeverity||'N/A'}
Reporting Officer: ${supName}, ${formData.supervisorTitle||''}

People Involved:
${peopleSummary}

Incident Description: ${formData.incidentDescription||'N/A'}
Action Taken: ${formData.actionTaken||'N/A'}
EMS/Police: ${formData.emsPolice||'N/A'}
Camera: ${formData.cameraCapture||'N/A'}
Safe Ops Contacted: ${formData.safeOpsContacted||'N/A'} — ${formData.safeOpsWho||''}
Follow-Up: ${formData.followUp||'N/A'} — ${formData.followUpDetails||''}
Additional Comments: ${formData.additionalComments||'None'}

Return ONLY the narrative text. No preamble, no labels, no markdown.`;

    try {
      const r = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:narrativePrompt}]})
      });
      const d = await r.json();
      formData.professionalNarrative = d.content&&d.content[0] ? d.content[0].text.trim() : '';
    } catch(e){ formData.professionalNarrative = formData.incidentDescription||''; }
    removeTyping();
  }

  addBubble("Your report is ready. Please review everything carefully before signing. You can edit any of your responses below.",'ai');

  // Show narrative block
  if(isIncident && formData.professionalNarrative){
    const nb = document.createElement('div');
    nb.className = 'bubble-row ai';
    const av = document.createElement('div'); av.className='avatar ai'; av.textContent='AI';
    const bub = document.createElement('div'); bub.className='bubble ai';
    bub.innerHTML = `<strong>Professional Narrative:</strong><div class="narrative-block">${formData.professionalNarrative.replace(/\n/g,'<br>')}</div>`;
    nb.appendChild(av); nb.appendChild(bub);
    chatWindow.appendChild(nb);
    scrollBottom();
  }

  const card=document.createElement('div'); card.className='form-preview';
  card.innerHTML=buildFormHTML(isIncident,supName,empName);
  chatWindow.appendChild(card);

  // Action buttons — edit, save, download, and Ready to Sign
  const editBtn = card.querySelector('.edit-report-btn');
  const saveBtn = card.querySelector('.save-edits-btn');
  const pdfBtn = card.querySelector('.download-pdf-btn');
  const wordBtn = card.querySelector('.download-word-btn');
  const statusDiv = card.querySelector('.email-status');

  // Ready to Sign button — appears below report, before signature pad
  const signReadyBtn = document.createElement('button');
  signReadyBtn.style.cssText = 'width:100%;margin-top:12px;padding:16px;background:var(--safe-navy);color:#fff;border:none;border-radius:12px;font-family:Inter,sans-serif;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.3px;';
  signReadyBtn.textContent = '✍️ I\'ve Reviewed — Ready to Sign';
  card.appendChild(signReadyBtn);

  let editMode = false;
  editBtn.onclick = () => {
    editMode = true;
    editBtn.style.display='none';
    saveBtn.style.display='block';
    signReadyBtn.style.display='none';
    card.querySelectorAll('.editable-value').forEach(el => {
      el.style.display='none';
      el.nextElementSibling.style.display='block';
    });
    // Spell check reminder
    addBubble(`${formData.supervisorFirstName||'Officer'}, feel free to use your browser's spell check before saving — right-click any field to see suggestions, or just review carefully for typos.`,'ai');
    scrollBottom();
  };
  saveBtn.onclick = () => {
    editMode = false;
    card.querySelectorAll('.editable-input').forEach(inp => {
      const key = inp.dataset.key;
      if(key) formData[key] = inp.value;
      inp.style.display='none';
      inp.previousElementSibling.textContent = inp.value;
      inp.previousElementSibling.style.display='block';
    });
    saveBtn.style.display='none';
    editBtn.style.display='block';
    signReadyBtn.style.display='block';
    scrollBottom();
  };

  pdfBtn.onclick=()=>generatePDF(isIncident);
  wordBtn.onclick=()=>generateWord(isIncident);

  // Ready to Sign — shows signature pad, locks report
  signReadyBtn.onclick = async () => {
    signReadyBtn.disabled = true;
    signReadyBtn.textContent = '⏳ Opening signature pad...';
    editBtn.style.display='none';
    saveBtn.style.display='none';
    // Scroll to bottom so signature pad is visible
    scrollBottom();
    await delay(500);
    showSignaturePad(async(sigDataUrl)=>{
      formData.supervisorSignature = sigDataUrl;
      // LEGAL ACCURACY FIX: re-stamp the official filing time at the moment of
      // signature (the true point of completion), not page load time which may
      // be stale if the officer was interrupted mid-report.
      const signedAt = new Date();
      formData.date = signedAt.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
      formData.time = signedAt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('timestampBar').textContent = `📍 ${formData.venue.split(',')[0]}  ·  ${formData.date}  ·  ${formData.time}  ·  Auto-captured`;
      signReadyBtn.remove();
      // Pre-generate the report HTML for sharing (no popup — just builds the string).
      // Wrapped defensively — if this fails, sharePDF() will detect the missing cache
      // and regenerate fresh when the officer actually taps Share.
      try { generatePDF(isIncident, true); } catch(e) { console.error('PDF pre-cache failed:', e); }
      // Show signature on card
      const sigRow = document.createElement('div');
      sigRow.style.cssText='padding:10px 18px;border-top:1px solid var(--border);margin-top:8px;';
      sigRow.innerHTML=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px;">Supervisor Signature</div><img src="${sigDataUrl}" style="max-width:200px;border:1px solid var(--border);border-radius:6px;display:block;"/><div style="font-size:13px;font-weight:700;color:var(--text-main);margin-top:6px;border-top:1.5px solid var(--border);padding-top:4px;">${supName}</div><div style="font-size:11px;color:var(--text-muted);">${formData.supervisorTitle||''}</div>`;
      card.appendChild(sigRow);
      // Show submit buttons — report is now locked
      const submitWrap = document.createElement('div');
      submitWrap.style.cssText='padding:0 0 8px;';
      submitWrap.innerHTML=`
        <div style="font-size:12px;color:var(--text-muted);text-align:center;margin:12px 0 8px;font-style:italic;">Report signed and locked. Download or submit below.</div>
        <button class="download-pdf-btn" style="margin-top:6px;">⬇ Download Professional PDF</button>
        <button class="download-word-btn" style="margin-top:6px;">⬇ Download Word Document</button>
        <button class="share-btn" style="margin-top:6px;width:100%;background:#fff;border:2px solid var(--safe-navy);color:var(--safe-navy);padding:14px;border-radius:10px;font-family:Inter,sans-serif;font-size:15px;font-weight:700;cursor:pointer;">📤 Share Report (with file attached)</button>
        <div style="font-size:11px;color:var(--text-muted);text-align:center;margin:8px 0 4px;line-height:1.4;">👆 Use <strong>Share Report</strong> to send the actual report file. The button below saves to S.A.F.E. records and opens an email with the report as text only — no attachment.</div>
        <button class="submit-btn" style="margin-top:6px;">📧 Save to Records & Email Text Summary</button>
        <div class="email-status"></div>
      `;
      card.appendChild(submitWrap);
      submitWrap.querySelector('.download-pdf-btn').onclick=()=>generatePDF(isIncident);
      submitWrap.querySelector('.download-word-btn').onclick=()=>generateWord(isIncident);
      submitWrap.querySelector('.share-btn').onclick=()=>sharePDF(isIncident);
      const finalSubmitBtn = submitWrap.querySelector('.submit-btn');
      const finalStatusDiv = submitWrap.querySelector('.email-status');
      finalSubmitBtn.onclick=async()=>{
        finalSubmitBtn.disabled=true;
        finalStatusDiv.className='email-status sending';
        finalStatusDiv.textContent='💾 Saving report to S.A.F.E. records...';
        const saved = await submitToSheets(isIncident);
        await delay(800);
        sendViaMailto(isIncident);
        finalStatusDiv.className = saved ? 'email-status sent' : 'email-status error';
        if(saved){
          finalStatusDiv.textContent='✅ Report saved and email opened — tap Send in your mail app to notify HR.';
          clearDraft(); // Only clear the offline draft once the save is confirmed
        } else {
          finalStatusDiv.textContent='⚠️ Could not confirm the report saved to S.A.F.E. records (no connection detected). A backup copy is stored on this device, and your email draft has been opened — please send it now, and retry Submit once you have a connection.';
          finalSubmitBtn.disabled=false;
          finalSubmitBtn.textContent='🔄 Retry Submit';
        }
      };
      scrollBottom();
      addBubble('✅ Report signed and locked. Download your copy or submit to HR below.','ai');
    });
  };

  scrollBottom();
}

// ── PDF GENERATION ─────────────────────────────────────────────────────────
function generatePDF(isIncident, silent) {
  const fd = formData;
  const supName = `${fd.supervisorFirstName||''} ${fd.supervisorLastName||''}`.trim();
  const empName = `${fd.employeeFirstName||''} ${fd.employeeLastName||''}`.trim();
  const title = isIncident ? 'Incident Report' : 'Employee Recognition Report';
  const submissionId = 'SAFE-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(Math.random()*9000+1000);

  const css = `
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', Arial, sans-serif; font-size: 13px; color: #1e1e1e; background: #fff; padding: 48px 0 0; }
    .page { max-width: 800px; margin: 0 auto; padding: 0; }

    /* LETTERHEAD */
    .letterhead { background: #134D7F; padding: 20px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 5px solid #D82E44; }
    .lh-left { display: flex; flex-direction: column; }
    .lh-logo { font-family: Georgia, serif; font-size: 32px; color: #D82E44; font-weight: 700; letter-spacing: 4px; line-height: 1; }
    .lh-mgmt { font-size: 11px; font-weight: 700; color: #C8CDD4; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
    .lh-right { text-align: right; }
    .lh-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
    .lh-sub { font-size: 10px; color: #C8CDD4; margin-top: 3px; letter-spacing: 0.5px; }
    .lh-season { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
    .lh-year { font-size: 16px; font-weight: 700; color: #D82E44; letter-spacing: 2px; }
    .lh-motto { font-size: 8px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }

    /* ID BAR */
    .id-bar { background: #D82E44; color: #fff; padding: 6px 30px; font-size: 11px; font-weight: 500; display: flex; justify-content: space-between; }

    /* BODY */
    .body { padding: 24px 30px; }

    /* SECTION */
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #D82E44; border-bottom: 2px solid #D82E44; padding-bottom: 4px; margin: 20px 0 10px; }
    .section-title:first-child { margin-top: 0; }

    /* FIELDS */
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 4px; }
    .field-grid.single { grid-template-columns: 1fr; }
    .field { margin-bottom: 6px; }
    .field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #475569; margin-bottom: 2px; }
    .field-value { font-size: 13px; color: #1e1e1e; padding: 6px 10px; background: #f4f4f4; border-left: 3px solid #134D7F; line-height: 1.5; }
    .field-value.unknown { color: #94a3b8; font-style: italic; }
    .field-value.narrative { background: #f4f4f4; border-left: 3px solid #134D7F; padding: 10px 12px; line-height: 1.7; }
    .breakdown-grid { border: 1px solid #d4dbe6; border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .breakdown-row { display: grid; grid-template-columns: 130px 1fr; border-bottom: 1px solid #e8edf3; }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-label { background: #eef3f9; padding: 8px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #134D7F; display: flex; align-items: center; }
    .breakdown-value { padding: 8px 12px; font-size: 12px; line-height: 1.5; color: #1e1e1e; }
    .pdf-photo-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; }
    .pdf-photo-wrap { display: flex; flex-direction: column; align-items: center; }
    .pdf-photo { width: 160px; height: 160px; object-fit: cover; border-radius: 6px; border: 2px solid #134D7F; }
    .pdf-photo-meta { font-size: 9px; color: #64748b; text-align: center; margin-top: 4px; line-height: 1.4; max-width: 160px; }
    @media print { .pdf-photo { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

    /* SEVERITY BADGES */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .badge.minor { background: #d1fae5; color: #065f46; }
    .badge.moderate { background: #fef9c3; color: #854d0e; }
    .badge.serious { background: #fee2e2; color: #991b1b; }

    /* SIGNATURE BLOCK */
    .sig-section { margin-top: 30px; border-top: 2px solid #134D7F; padding-top: 20px; }
    .sig-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 16px; }
    .sig-box { border-top: 1.5px solid #1e1e1e; padding-top: 8px; }
    .sig-label { font-size: 11px; color: #475569; font-weight: 500; }
    .sig-name { font-size: 12px; color: #1e1e1e; margin-top: 4px; font-weight: 700; }
    .sig-space { height: 40px; }

    /* DISCLAIMER */
    .disclaimer { font-size: 10px; color: #94a3b8; font-style: italic; margin-top: 20px; padding-top: 12px; border-top: 1px solid #e2e8f0; line-height: 1.6; text-align: center; }

    /* FOOTER */
    .footer { background: #134D7F; padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
    .footer-text { font-size: 10px; color: #C8CDD4; }
    .footer-logo { font-family: Georgia, serif; font-size: 14px; color: #D82E44; font-weight: 700; letter-spacing: 2px; }

    @media print {
      body { padding: 0; }
      .page { max-width: 100%; }
      @page { margin: 0; }
    }
  `;

  function fv(label, value, full) {
    const val = value ? escapeHtml(value) : 'Unknown / Not Available';
    const cls = (!value || value === 'Unknown / Not Available') ? 'unknown' : '';
    return `<div class="field${full?' full':''}"><div class="field-label">${escapeHtml(label)}</div><div class="field-value ${cls}">${val}</div></div>`;
  }

  function severityBadge(sev) {
    if (!sev) return 'Unknown / Not Available';
    if (sev.includes('Minor')) return `<span class="badge minor">${sev}</span>`;
    if (sev.includes('Moderate')) return `<span class="badge moderate">${sev}</span>`;
    if (sev.includes('Serious')) return `<span class="badge serious">${sev}</span>`;
    return sev;
  }

  let body = '';

  // Report Information
  body += `<div class="section-title">Report Information</div>`;
  body += `<div class="field-grid">`;
  body += fv('Incident Date', fd.incidentDate || fd.date);
  body += fv('Incident Time', fd.incidentTime || fd.time);
  body += fv('Report Filed (Auto-Captured)', fd.date + ' at ' + fd.time);
  body += fv('Venue', fd.venue);
  body += fv('Prepared By', supName);
  body += fv('Supervisor Title', fd.supervisorTitle);
  body += fv('Supervisor Email', fd.supervisorEmail);
  body += fv('Report Type', fd.formType);
  body += `</div>`;

  if (isIncident) {
    // Incident Details
    body += `<div class="section-title">Incident Details</div>`;
    body += `<div class="field-grid">`;
    body += fv('Event', fd.eventName);
    body += fv('Incident Category', fd.incidentCategory);
    body += `<div class="field"><div class="field-label">Severity</div><div class="field-value">${severityBadge(fd.incidentSeverity)}</div></div>`;
    body += fv('Incident Location', fd.incidentLocation);
    body += fv('Environmental Conditions', fd.environmentalConditions);
    body += `</div>`;

    // Camera & Communications
    body += `<div class="section-title">Camera & Communications</div>`;
    body += `<div class="field-grid">`;
    body += fv('Captured on Surveillance Camera', fd.cameraCapture);
    body += fv('Camera Zone / Area', fd.cameraZone);
    body += fv('Safe Ops / Manager Contacted', fd.safeOpsContacted);
    body += fv('Who Was Contacted', fd.safeOpsWho);
    body += `</div>`;

    // People — Subjects / Involved Parties / Employees
    function renderPersonPDF(p){
      let h = `<div style="border:1px solid #d4dbe6;border-radius:6px;padding:10px 12px;margin-bottom:10px;">`;
      h += `<div style="font-weight:700;font-size:13px;color:#134D7F;margin-bottom:6px;">${escapeHtml(p.name)} — ${escapeHtml(p.roleCategory)}</div>`;
      h += `<div class="field-grid">`;
      if(p.role) h += fv('Role / Position', p.role);
      if(p.seatLocation) h += fv('Seat Location', p.seatLocation);
      if(p.gender) h += fv('Gender', p.gender);
      if(p.ageRange) h += fv('Age Range', p.ageRange);
      if(p.height) h += fv('Height', p.height);
      if(p.build) h += fv('Build', p.build);
      if(p.hairColor) h += fv('Hair Color', p.hairColor);
      if(p.hairStyle) h += fv('Hair Style', p.hairStyle);
      if(p.clothing) h += fv('Clothing', p.clothing);
      if(p.features) h += fv('Distinguishing Features', p.features);
      h += `</div>`;
      if(p.statement) h += `<div style="margin-top:6px;"><div class="field-label">Statement</div><div class="field-value">${escapeHtml(p.statement)}</div></div>`;
      if(p.photoDataUrls && p.photoDataUrls.length > 0){
        h += `<div class="pdf-photo-grid" style="margin-top:8px;">`;
        p.photoDataUrls.forEach((url, idx) => {
          const meta = p.photoMeta && p.photoMeta[idx] ? p.photoMeta[idx] : null;
          h += `<div class="pdf-photo-wrap"><img class="pdf-photo" src="${url}"/>`;
          if(meta) h += `<div class="pdf-photo-meta">Captured: ${meta.captured}<br>By: ${meta.takenBy}</div>`;
          h += `</div>`;
        });
        h += `</div>`;
      }
      h += `</div>`;
      return h;
    }

    const pdfSubjects = getSubjectPeople();
    const pdfWitnesses = getWitnessPeople();

    body += `<div class="section-title">Subjects / Involved Parties</div>`;
    if(pdfSubjects.length > 0){
      pdfSubjects.forEach(p => { body += renderPersonPDF(p); });
    } else {
      body += `<div class="field-value unknown">No subjects recorded</div>`;
    }

    if(fd.scenePhotoDataUrls && fd.scenePhotoDataUrls.length > 0){
      body += `<div class="field"><div class="field-label">Scene / Evidence Photos</div><div class="pdf-photo-grid">`;
      fd.scenePhotoDataUrls.forEach((url, idx) => {
        const meta = fd.scenePhotoMeta && fd.scenePhotoMeta[idx] ? fd.scenePhotoMeta[idx] : null;
        body += `<div class="pdf-photo-wrap"><img class="pdf-photo" src="${url}"/>`;
        if(meta) body += `<div class="pdf-photo-meta">Captured: ${meta.captured}<br>By: ${meta.takenBy}</div>`;
        body += `</div>`;
      });
      body += `</div></div>`;
    } else {
      body += fv('Scene / Evidence Photos', fd.scenePhotos||'None');
    }

    body += `<div class="section-title">Witnesses</div>`;
    if(pdfWitnesses.length > 0){
      pdfWitnesses.forEach(p => { body += renderPersonPDF(p); });
    } else {
      body += `<div class="field-value unknown">No witnesses recorded</div>`;
    }

    // Incident Narrative
    body += `<div class="section-title">Incident Narrative</div>`;
    if(fd.professionalNarrative){
      body += `<div class="field"><div class="field-label">Professional Narrative</div><div class="field-value narrative">${escapeHtml(fd.professionalNarrative)}</div></div>`;
    }

    // Incident Breakdown — Facts vs. Conclusions, courtroom-friendly structure
    const outcomeText = fd.followUp && fd.followUp.startsWith('No')
      ? 'The incident concluded without further enforcement action.'
      : (fd.followUpDetails || 'Follow-up action was required; see Follow-Up section below.');
    body += `<div class="field"><div class="field-label" style="color:#134D7F;font-size:11px;margin-top:6px;">Incident Breakdown</div></div>`;
    body += `<div class="breakdown-grid">`;
    body += `<div class="breakdown-row"><div class="breakdown-label">Observed</div><div class="breakdown-value">${fd.incidentDescription || 'Not provided'}</div></div>`;
    body += `<div class="breakdown-row"><div class="breakdown-label">Statement</div><div class="breakdown-value">${fd.guestStatement || 'No statement provided'}</div></div>`;
    body += `<div class="breakdown-row"><div class="breakdown-label">Officer Action</div><div class="breakdown-value">${fd.actionTaken || 'Not provided'}</div></div>`;
    body += `<div class="breakdown-row"><div class="breakdown-label">Outcome</div><div class="breakdown-value">${outcomeText}</div></div>`;
    body += `</div>`;

    body += `<div class="field" style="margin-top:10px;"><div class="field-label">Officer's Description</div><div class="field-value narrative">${escapeHtml(fd.incidentDescription) || 'Not provided'}</div></div>`;
    body += `<div class="field-grid" style="margin-top:10px;">`;
    body += fv('Action Taken', fd.actionTaken);
    body += fv('EMS / Police Involvement', fd.emsPolice);
    body += fv('Guest Transported', fd.guestTransported);
    body += `</div>`;

    // Follow-Up
    body += `<div class="section-title">Follow-Up</div>`;
    body += `<div class="field-grid">`;
    body += fv('Follow-Up Required', fd.followUp);
    body += fv('Follow-Up Details', fd.followUpDetails);
    body += fv('Recommendation', fd.recommendation);
    body += `</div>`;

  } else {
    // Recognition
    body += `<div class="section-title">Recognition Details</div>`;
    body += `<div class="field-grid">`;
    body += fv('Employee Name', empName);
    body += fv('Employee Role', fd.employeeRole);
    body += `</div>`;
    body += `<div class="field"><div class="field-label">Description of Good Deed</div><div class="field-value narrative">${escapeHtml(fd.recognitionDescription) || 'Not provided'}</div></div>`;
    body += `<div class="field" style="margin-top:10px;"><div class="field-label">Impact & S.A.F.E. Values</div><div class="field-value narrative">${escapeHtml(fd.recognitionImpact) || 'Not provided'}</div></div>`;
  }

  // Additional Comments
  body += `<div class="section-title">Additional Comments</div>`;
  body += `<div class="field"><div class="field-value">${fd.additionalComments || 'None'}</div></div>`;

  // Signature Block
  body += `
    <div class="sig-section">
      <div class="section-title" style="border:none;margin-top:0;">Signatures</div>
      <div class="sig-grid">
        <div class="sig-box">
          <div class="sig-space">${fd.supervisorSignature?`<img src="${fd.supervisorSignature}" style="max-height:38px;max-width:160px;"/>`:''}</div>
          <div class="sig-label">Supervisor Signature</div>
          <div class="sig-name">${supName}</div>
        </div>
        <div class="sig-box">
          <div class="sig-space"></div>
          <div class="sig-label">Date Submitted</div>
          <div class="sig-name">${fd.date || ''}</div>
        </div>
        <div class="sig-box">

// ── SHARE FEATURE — Web Share API for mobile (works offline for local sharing) ──
async function sharePDF(isIncident) {
  const fd = formData;
  const title = isIncident ? 'Incident Report' : 'Employee Recognition Report';

  // Defensive regeneration: don't trust a possibly-stale or missing pre-cache.
  // If lastReportHTML is missing or suspiciously short, rebuild it fresh right now.
  if(!window.lastReportHTML || window.lastReportHTML.length < 500){
    try {
      generatePDF(isIncident, true);
    } catch(e) {
      console.error('Failed to regenerate report HTML for sharing:', e);
    }
  }

  const submissionId = window.lastReportSubmissionId || ('SAFE-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(Math.random()*9000+1000));
  const filename = `SAFE_${isIncident?'Incident':'Recognition'}_Report_${submissionId}.html`;

  // If we genuinely have no usable report content, don't attach an empty/broken file —
  // tell the officer honestly and point them to Download instead.
  if(!window.lastReportHTML || window.lastReportHTML.length < 500){
    alert('Unable to prepare the report file for sharing right now. Please use the "Download Professional PDF" button instead, then attach that file manually to your email.');
    return;
  }

  if (navigator.share && navigator.canShare) {
    try {
      const blob = new Blob([window.lastReportHTML], {type:'text/html'});
      const file = new File([blob], filename, {type:'text/html'});

      if (navigator.canShare({files:[file]})) {
        await navigator.share({
          title: `S.A.F.E. ${title} — ${submissionId}`,
          text: `S.A.F.E. Management ${title} for ${fd.venue}. Open the attached file in any browser to view the formatted report, or print it to PDF.`,
          files: [file]
        });
        return;
      }
    } catch(e) {
      if(e.name === 'AbortError') return;
      console.error('File share failed, falling back to text share:', e);
    }
  }

  if (navigator.share) {
    try {
      const summary = `S.A.F.E. ${title}\nSubmission ID: ${submissionId}\nVenue: ${fd.venue}\nDate: ${fd.date}\nPrepared by: ${fd.supervisorFirstName||''} ${fd.supervisorLastName||''}\n\nNote: Your browser doesn't support file sharing — please use Download PDF instead and attach manually.`;
      await navigator.share({ title: `S.A.F.E. ${title} — ${submissionId}`, text: summary });
    } catch(e) {
      if(e.name !== 'AbortError') console.error('Share failed:', e);
    }
  } else {
    alert('Sharing is not supported on this browser. Please use the Download PDF button instead, then attach the file manually to your email.');
  }
}

    content += `CAMERA & COMMUNICATIONS\n${'-'.repeat(30)}\n`;
    content += `Surveillance Camera: ${fd.cameraCapture||'N/A'}\nCamera Zone: ${fd.cameraZone||'N/A'}\n`;
    content += `Safe Ops Contacted: ${fd.safeOpsContacted||'N/A'}\nContacted: ${fd.safeOpsWho||'N/A'}\n\n`;
    content += `GUEST INFORMATION\n${'-'.repeat(30)}\n`;

    if(fd.professionalNarrative){
      content += `PROFESSIONAL NARRATIVE\n${'-'.repeat(30)}\n${fd.professionalNarrative}\n\n`;
    }
    content += `INCIDENT NARRATIVE\n${'-'.repeat(30)}\n${fd.incidentDescription||'N/A'}\n\n`;
    content += `Guest Statement: ${fd.guestStatement||'N/A'}\n`;
    content += `Witnesses: ${fd.witnesses||'None'}\nAction Taken: ${fd.actionTaken||'N/A'}\n`;
    content += `EMS/Police: ${fd.emsPolice||'N/A'}\nGuest Transported: ${fd.guestTransported||'N/A'}\n\n`;
    content += `FOLLOW-UP\n${'-'.repeat(30)}\n`;
    content += `Required: ${fd.followUp||'N/A'}\nDetails: ${fd.followUpDetails||'N/A'}\nRecommendation: ${fd.recommendation||'N/A'}\n\n`;
  } else {
    const empName=`${fd.employeeFirstName||''} ${fd.employeeLastName||''}`.trim();
    content += `RECOGNITION DETAILS\n${'-'.repeat(30)}\n`;
    content += `Employee: ${empName}\nRole: ${fd.employeeRole||'N/A'}\n\n`;
    content += `Description:\n${fd.recognitionDescription||'N/A'}\n\n`;
    content += `Impact & S.A.F.E. Values:\n${fd.recognitionImpact||'N/A'}\n\n`;
  }
  content += `Additional Comments: ${fd.additionalComments||'None'}\n\n`;

  content += `Signature: _______________________\n\n`;
  content += `Physical description provided for identification purposes only.\nThis report is confidential and intended solely for S.A.F.E. Management and Ford Field HR review.\n`;

  // Convert to RTF for proper Word formatting
  const esc = s => (s||'N/A').replace(/[\\{}]/g,'\\$&').replace(/\n/g,'\\par ');
  const rtfField = (lbl,val) => '{\\pard\\sb40{\\b '+esc(lbl)+': }'+esc(val||'N/A')+'\\par}';
  const rtfHead = s => '{\\pard\\sb180\\sa60\\b\\fs24\\cf1 '+esc(s)+'\\par}';
  const rtfDiv = '{\\pard\\brdrb\\brdrs\\brdrw6 \\par}';

  let rtf = '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Arial;}}{\\colortbl;\\red26\\green46\\blue74;\\red232\\green25\\blue44;}\\f0\\fs22\\paperw12240\\paperh15840\\margl1440\\margr1440\\margt1440\\margb1440';
  rtf += '{\\pard\\qc\\b\\fs32\\cf1 S.A.F.E. MANAGEMENT\\par}';
  rtf += '{\\pard\\qc\\b\\fs26\\cf2 '+(isIncident?'INCIDENT REPORT':'EMPLOYEE RECOGNITION REPORT')+'\\par}';
  rtf += '{\\pard\\qc\\fs18 Submission ID: '+submissionId+' | Filed: '+esc(content.split('\n')[2].replace('Filed: ',''))+'\\par}';
  rtf += rtfDiv;
  // Re-use the plain text content, converting line by line
  content.split('\n').forEach(line => {
    if(line.startsWith('===')) { rtf += rtfDiv; }
    else if(line.match(/^[A-Z &]+$/)) { rtf += rtfHead(line); }
    else if(line.startsWith('---')) { /* skip */ }
    else if(line.includes(': ')) { const [lbl,...rest]=line.split(': '); rtf += rtfField(lbl, rest.join(': ')); }
    else if(line.trim()) { rtf += '{\\pard\\sb20 '+esc(line)+'\\par}'; }
  });
  rtf += '}';

  const blob = new Blob([rtf], {type:'application/rtf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'SAFE_'+(isIncident?'Incident':'Recognition')+'_Report_'+submissionId+'.doc';
  a.click();
  URL.revokeObjectURL(url);
}

function ff(label,value,key){
  const val=value||'Unknown / Not Available';
  const cls=(!value||value==='Unknown / Not Available')?'unknown':'';
  const editInput=key?`<textarea class="field-value-edit editable-input" data-key="${key}" spellcheck="true" autocorrect="on" style="display:none">${val}</textarea>`:'';
  const spanClass=key?'editable-value':'';
  return `<div class="form-field"><label>${label}</label><span class="${cls} ${spanClass}">${val}</span>${editInput}</div>`;
}

async function handleSend(){
  const raw=userInput.value.trim();

  if(!raw||!awaitingInput)return;

// ── RESUME FLOW — restores state from a saved draft and continues the conversation ──
async function resumeFlow(draft){
  chatWindow.innerHTML='';
  showVoiceFloat();

  // Restore state
  Object.assign(formData, draft.formData);
  if(!formData.people) formData.people = [];
  migrateLegacyGuestToPeople(); // upgrade any pre-people-array draft data
  incidentType = draft.incidentType;
  activeFlow = incidentType === 'incident' ? incidentFlow : (incidentType === 'recognition' ? recognitionFlow : baseFlow);
  flowIndex = draft.flowIndex || 0;

  // If we never made it past the base flow (no formType chosen yet), restart from base flow
  if(!incidentType){
    activeFlow = baseFlow;
    flowIndex = Math.min(flowIndex, baseFlow.length);
  }

  showTyping(); await delay(700); removeTyping();
  addBubble(`Welcome back${formData.supervisorFirstName?', '+formData.supervisorFirstName:''}. Picking up right where you left off.`,'ai');
  await delay(400);
  await askNextQuestion();
}

  let selectedDate = new Date(defaultDate);

  const wrap = document.createElement('div');

    const header = document.createElement('div');
    header.className = 'calendar-header';

    const prevBtn = document.createElement('button');
    prevBtn.className = 'cal-nav';
    prevBtn.textContent = '‹';
    prevBtn.onclick = () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      buildCalendar();
    };

    const monthLabel = document.createElement('div');
    monthLabel.className = 'cal-month-label';
    monthLabel.textContent = new Date(viewYear, viewMonth).toLocaleDateString('en-US', {month:'long', year:'numeric'});

    const nextBtn = document.createElement('button');
    nextBtn.className = 'cal-nav';
    nextBtn.textContent = '›';
    nextBtn.onclick = () => {
      // Don't allow navigating to future months
      const nextMonth = new Date(viewYear, viewMonth + 1);
      const currentMonth = new Date(now.getFullYear(), now.getMonth());
      if (nextMonth <= currentMonth) {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        buildCalendar();
      }
    };

    header.appendChild(prevBtn);
    header.appendChild(monthLabel);
    header.appendChild(nextBtn);
    wrap.appendChild(header);

    // Day headers
    const grid = document.createElement('div');
    grid.className = 'calendar-grid';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
      const dh = document.createElement('div');
      dh.className = 'cal-day-header';
      dh.textContent = d;
      grid.appendChild(dh);
    });

    // Days
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    // Previous month padding
    for (let i = firstDay - 1; i >= 0; i--) {
      const d = document.createElement('div');
      d.className = 'cal-day other-month';
      d.textContent = daysInPrevMonth - i;
      grid.appendChild(d);
    }

    // Current month days
    for (let day = 1; day <= daysInMonth; day++) {
      const d = document.createElement('div');
      d.className = 'cal-day';
      d.textContent = day;

      const thisDate = new Date(viewYear, viewMonth, day);
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      // Future dates disabled
      if (thisDate > todayDate) {
        d.classList.add('future');
      } else {
        if (thisDate.toDateString() === todayDate.toDateString()) d.classList.add('today');
        if (thisDate.toDateString() === selectedDate.toDateString()) d.classList.add('selected');

        d.onclick = () => {
          selectedDate = new Date(viewYear, viewMonth, day);
          buildCalendar();
        };
      }
      grid.appendChild(d);
    }
    wrap.appendChild(grid);

    // Time picker
    const timeLabel = document.createElement('h4');
    timeLabel.textContent = 'Select Approximate Time';
    wrap.appendChild(timeLabel);

    const timePicker = document.createElement('div');
    timePicker.className = 'time-picker';

    const hourSelect = document.createElement('select');
    hourSelect.className = 'time-select';
    hourSelect.id = 'calHour';
    for (let h = 1; h <= 12; h++) {
      const opt = document.createElement('option');
      opt.value = h;
      opt.textContent = h;
      if (h === (selectedDate.getHours() % 12 || 12)) opt.selected = true;
      hourSelect.appendChild(opt);
    }

    const sep = document.createElement('div');
    sep.className = 'time-separator';
    sep.textContent = ':';

    const minSelect = document.createElement('select');
    minSelect.className = 'time-select';
    minSelect.id = 'calMin';
    ['00','15','30','45'].forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      minSelect.appendChild(opt);
    });

    const ampmSelect = document.createElement('select');
    ampmSelect.className = 'time-ampm';
    ampmSelect.id = 'calAmPm';
    ['AM','PM'].forEach(ap => {
      const opt = document.createElement('option');
      opt.value = ap;
      opt.textContent = ap;
      if ((selectedDate.getHours() >= 12 ? 'PM' : 'AM') === ap) opt.selected = true;
      ampmSelect.appendChild(opt);
    });

    timePicker.appendChild(hourSelect);
    timePicker.appendChild(sep);
    timePicker.appendChild(minSelect);
    timePicker.appendChild(ampmSelect);
    wrap.appendChild(timePicker);

    const approxNote = document.createElement('div');
    approxNote.className = 'time-approx-note';
    approxNote.textContent = 'Approximate time is fine if exact time is unknown.';
    wrap.appendChild(approxNote);

    // Confirm button
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'cal-confirm-btn';
    confirmBtn.textContent = '✓ Confirm Date & Time';
    confirmBtn.onclick = () => {
      const h = document.getElementById('calHour').value;
      const m = document.getElementById('calMin').value;
      const ap = document.getElementById('calAmPm').value;
      const dateStr = selectedDate.toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
      const timeStr = `${h}:${m} ${ap}`;
      wrap.remove();
      onConfirm(dateStr, timeStr);
    };
    wrap.appendChild(confirmBtn);
  }

  buildCalendar();
  chatWindow.appendChild(wrap);
  scrollBottom();
}

async function startFlow(){
  chatWindow.innerHTML='';
  showVoiceFloat();
  activeFlow=baseFlow; flowIndex=0;
  showTyping(); await delay(700); removeTyping();
  addBubble(`Good ${getTimeOfDay()}. I've recorded right now as the <strong>report filing time: ${formData.date} at ${formData.time}</strong>. This timestamp is locked for HR records.<br><br>Before we begin — what is your first name?`,'ai');
  inputArea.style.display='flex';
  awaitingInput=true;
  document.getElementById('inputHint').style.display='block';
  userInput.focus();
  sendInterceptor=async(firstName)=>{
    // Strip filler words/phrases before capturing name
    let cleaned = firstName.trim();
    const fillers = [/^(it'?s|i'?m|my name is|this is|i am)\s+/i, /^(is|im|ive)\s+/i];
    fillers.forEach(re => { cleaned = cleaned.replace(re, ''); });
    const name = cleaned.trim().split(' ')[0] || firstName.trim().split(' ')[0];
    formData.supervisorFirstName = escapeHtml(name);
    inputArea.style.display='none'; awaitingInput=false;
    sendInterceptor=null;
    // Ask last name
    showTyping(); await delay(600); removeTyping();
    addBubble(`Nice to meet you, <strong>${name}</strong>. And your last name?`,'ai');
    inputArea.style.display='flex'; awaitingInput=true;
    document.getElementById('inputHint').style.display='block';
    userInput.focus();
    sendInterceptor=async(lastName)=>{
      let cleanedLast = lastName.trim();
      const fillersLast = [/^(it'?s|i'?m|my last name is|this is|i am)\s+/i, /^(is|im|ive)\s+/i];
      fillersLast.forEach(re => { cleanedLast = cleanedLast.replace(re, ''); });
      formData.supervisorLastName = escapeHtml(cleanedLast.trim() || lastName.trim());
      inputArea.style.display='none'; awaitingInput=false;
      sendInterceptor=null;
      // Now ask when incident occurred
      showTyping(); await delay(600); removeTyping();
      addBubble(`Good to meet you, <strong>${name} ${formData.supervisorLastName}</strong>. When did this incident actually occur?`,'ai');
      await delay(300);
    addQuickReplies(['Just now','Earlier today','Yesterday','Another date'],async(val)=>{
      clearQuickReplies(); addBubble(val,'user');
      if(val==='Just now'){
        formData.incidentDate=formData.date;
        formData.incidentTime=formData.time;
        await askNextQuestion();
      } else if(val==='Earlier today'){
        showTyping(); await delay(500); removeTyping();
        addBubble("Please select the time the incident occurred.",'ai');
        const defaultDt = new Date();
        showDateTimePicker(defaultDt, async(dateStr, timeStr)=>{
          addBubble(`📅 ${dateStr} at ${timeStr}`,'user');
          formData.incidentDate = dateStr;
          formData.incidentTime = timeStr;
          await askNextQuestion();
        });
      } else if(val==='Yesterday'){
        showTyping(); await delay(500); removeTyping();
        addBubble("Please select the date and time the incident occurred.",'ai');
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate()-1);
        showDateTimePicker(yesterday, async(dateStr, timeStr)=>{
          addBubble(`📅 ${dateStr} at ${timeStr}`,'user');
          formData.incidentDate = dateStr;
          formData.incidentTime = timeStr;
          await askNextQuestion();
        });
      } else {
        showTyping(); await delay(500); removeTyping();
        addBubble("Please select the date and time the incident occurred.",'ai');
        const defaultDt = new Date();
        showDateTimePicker(defaultDt, async(dateStr, timeStr)=>{
          addBubble(`📅 ${dateStr} at ${timeStr}`,'user');
          formData.incidentDate = dateStr;
          formData.incidentTime = timeStr;
          await askNextQuestion();
        });
      }
    });
      inputArea.style.display='flex';
      awaitingInput=true;
      document.getElementById('inputHint').style.display='block';
    };
  };
}
init();
</script>
