  /* PROGRESS BAR */

  .header-left{display:flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .header-logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;color:var(--safe-red);letter-spacing:2px;line-height:1;}
  .header-tagline{font-size:9px;font-weight:700;color:var(--safe-silver);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
  .header-season{display:flex;flex-direction:column;align-items:center;line-height:1;padding:0 2px;}

  .header-divider{width:2px;height:30px;background:var(--safe-silver);opacity:.4;flex-shrink:0;}

  .header-info p{font-size:10px;color:var(--safe-silver);margin-top:1px;}

  .chat-window{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:scroll;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;background:#f4f7fb;}

  .welcome-card{background:var(--safe-navy);border-radius:16px;padding:22px 18px;color:#fff;border-left:4px solid var(--safe-red);box-shadow:0 4px 20px rgba(0,0,0,0.15);}

  /* Floating persistent voice toggle */

  .bubble-row{display:flex;gap:8px;align-items:flex-end;}

  .quick-replies{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 4px 38px;}

  .qr-btn:hover,.qr-btn.selected{background:var(--safe-navy);color:#fff;}
  .skip-note{font-size:11px;color:var(--text-muted);padding:2px 0 0 38px;font-style:italic;}

  .typing{display:flex;gap:4px;padding:13px 15px;background:#fff;border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;width:fit-content;box-shadow:0 1px 3px rgba(0,0,0,.06);}

  .input-area textarea::placeholder{color:var(--text-muted);}
  .send-btn{background:var(--safe-navy);border:none;border-radius:10px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;}

  /* FORM PREVIEW — mobile optimized */
  .form-preview{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:18px;margin:4px 0;}

  .submit-btn{width:100%;margin-top:10px;background:var(--success);color:#fff;border:none;padding:14px;border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px;}

  .submit-btn:disabled{background:var(--border);cursor:not-allowed;}
  .download-pdf-btn{width:100%;margin-top:14px;background:var(--safe-navy);color:#fff;border:none;padding:14px;border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px;}
  .download-pdf-btn:hover{background:#111e2e;}

  .email-status{margin-top:10px;padding:12px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;display:none;}
  .email-status.sending{background:#dbeafe;color:#1e40af;display:block;}
  .email-status.sent{background:#d1fae5;color:#065f46;display:block;}
  .email-status.error{background:#fee2e2;color:#991b1b;display:block;}

  /* Remember email checkbox */
  .remember-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--text-muted);}

  @media(max-width:480px){
    .bubble{font-size:15px;}
    .form-field span{font-size:15px;}
  }

  /* LOCATION PICKER */
  .location-picker{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .location-category{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--border);}
  .location-category:first-child{margin-top:0;padding-top:0;border-top:none;}
  .location-options{display:flex;flex-wrap:wrap;gap:6px;}
  .loc-btn{background:var(--light-bg);border:1.5px solid var(--border);color:var(--text-main);padding:8px 12px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;text-align:left;}
  .loc-btn:hover,.loc-btn.selected{background:var(--safe-navy);border-color:var(--safe-navy);color:#fff;}

  /* MIC BUTTON */
  .mic-btn{background:var(--lions-dark);border:2px solid var(--safe-silver);border-radius:10px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;position:relative;}
  .mic-btn svg{width:20px;height:20px;fill:var(--safe-silver);transition:fill .2s;}
  .mic-btn.listening{background:var(--danger,#ef4444);border-color:#ef4444;animation:micPulse 1s infinite;}
  .mic-btn.listening svg{fill:#fff;}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4);}50%{box-shadow:0 0 0 8px rgba(239,68,68,0);}}
  .mic-status{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--danger,#ef4444);white-space:nowrap;display:none;}
  .mic-btn.listening .mic-status{display:block;}
  .input-hint{font-size:11px;color:var(--text-muted);text-align:center;padding:4px 16px 6px;flex-shrink:0;background:#fff;border-top:none;}

  /* EVENT SEARCH PICKER */
  .event-search-wrap{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .event-search-input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:border-color .2s;color:var(--text-main);}
  .event-search-input:focus{border-color:var(--safe-navy);}
  .event-search-input::placeholder{color:var(--text-muted);}
  .event-search-hint{font-size:11px;color:var(--text-muted);font-style:italic;margin:6px 0 10px;text-align:center;}
  .event-search-results{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
  .event-search-results::-webkit-scrollbar{width:3px;}
  .event-search-results::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .event-result-item{padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--light-bg);font-size:13px;font-weight:500;color:var(--text-main);cursor:pointer;transition:all .15s;line-height:1.4;}
  .event-result-item:hover,.event-result-item.selected{background:var(--safe-navy);border-color:var(--safe-navy);color:#fff;}
  .event-result-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin:8px 0 4px;}
  .event-no-results{text-align:center;color:var(--text-muted);font-size:13px;font-style:italic;padding:12px 0;}
  .event-other-btn{width:100%;margin-top:10px;background:transparent;border:2px dashed var(--border);color:var(--text-muted);padding:10px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
  .event-other-btn:hover{border-color:var(--safe-navy);color:var(--safe-navy);}
  .datetime-picker{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:16px;margin:4px 0 4px 38px;max-width:84%;}
  .datetime-picker h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin-bottom:12px;}
  .calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav{background:var(--safe-navy);color:#fff;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .cal-month-label{font-weight:700;font-size:14px;color:var(--safe-navy);}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px;}
  .cal-day-header{text-align:center;font-size:10px;font-weight:700;color:var(--text-muted);padding:4px 0;}
  .cal-day{text-align:center;padding:7px 4px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;border:1.5px solid transparent;}
  .cal-day:hover{background:var(--light-bg);border-color:var(--safe-navy);}
  .cal-day.selected{background:var(--safe-navy);color:#fff;border-color:var(--safe-navy);}
  .cal-day.today{border-color:var(--safe-red);color:var(--safe-red);font-weight:700;}
  .cal-day.today.selected{background:var(--safe-red);color:#fff;border-color:var(--safe-red);}
  .cal-day.other-month{color:var(--border);cursor:default;}
  .cal-day.future{color:var(--border);cursor:not-allowed;}
  .time-picker{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
  .time-select{flex:1;padding:8px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text-main);outline:none;}

  .time-separator{font-weight:700;color:var(--safe-navy);font-size:18px;}

  .cal-confirm-btn{width:100%;background:var(--safe-red);color:#fff;border:none;border-radius:8px;padding:11px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;}
  .cal-confirm-btn:hover{background:#b5121f;}
  .cal-confirm-btn:disabled{background:var(--border);cursor:not-allowed;}

  /* PHOTO THUMBNAILS IN REPORT */
  .report-photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .report-photo-thumb{width:90px;height:90px;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer;}
  .report-photo-thumb:hover{border-color:var(--safe-navy);}
  .report-photo-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--safe-red);margin:8px 0 4px;}

  /* PHOTO UPLOAD */
  .photo-upload-wrap{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .photo-upload-wrap h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin-bottom:10px;}
  .photo-drop-zone{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:10px;}
  .photo-drop-zone:hover,.photo-drop-zone.drag-over{border-color:var(--safe-navy);background:var(--light-bg);}
  .photo-drop-zone p{font-size:13px;color:var(--text-muted);margin-top:6px;}
  .photo-drop-zone .icon{font-size:28px;}
  .photo-previews{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .photo-thumb{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:2px solid var(--border);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb .remove-photo{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .photo-count{font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:8px;}
  .photo-skip-btn{background:transparent;border:2px dashed var(--border);color:var(--text-muted);padding:10px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%;transition:all .2s;margin-top:4px;}
  .photo-skip-btn:hover{border-color:var(--safe-navy);color:var(--safe-navy);}

  /* SIGNATURE PAD */
  .sig-pad-wrap{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .sig-pad-wrap h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin-bottom:6px;}
  .sig-pad-hint{font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:10px;}
  #sigCanvas{width:100%;height:140px;border:2px solid var(--border);border-radius:10px;touch-action:none;cursor:crosshair;background:#fafafa;display:block;}
  .sig-pad-actions{display:flex;gap:8px;margin-top:8px;}
  .sig-clear-btn{flex:1;background:transparent;border:2px solid var(--border);color:var(--text-muted);padding:10px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  .sig-confirm-btn{flex:2;background:var(--safe-red);color:#fff;border:none;padding:10px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}

  /* NARRATIVE BLOCK */
  .narrative-block{background:var(--light-bg);border-left:4px solid var(--safe-red);border-radius:0 12px 12px 0;padding:14px 16px;margin:6px 0;font-size:14px;line-height:1.8;color:var(--text-main);font-style:italic;}

  /* EDIT MODE */
  .form-field.editable .field-value-edit{display:block;}
  .field-value-edit{display:none;width:100%;padding:8px 10px;border:2px solid var(--safe-navy);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;resize:vertical;min-height:36px;margin-top:4px;outline:none;}
  .edit-report-btn{width:100%;margin-top:8px;background:transparent;border:2px solid var(--safe-navy);color:var(--safe-navy);padding:12px;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
  .edit-report-btn:hover{background:var(--safe-navy);color:#fff;}
  .save-edits-btn{width:100%;margin-top:8px;background:var(--safe-navy);color:#fff;border:none;padding:12px;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:none;}
  .download-word-btn{width:100%;margin-top:8px;background:#2b579a;color:#fff;border:none;padding:14px;border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px;}
  .download-word-btn:hover{background:#1e3f6f;}

  /* ACTION BUTTONS ROW */
  .action-btn-row{display:flex;gap:8px;margin-top:8px;}
  .action-btn-row button{flex:1;}
</style>
</head>

  </div>
  <div class="header-divider"></div>
  <div class="header-season">
    <svg width="44" height="28" viewBox="0 0 44 28" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-bottom:2px;">
      <!-- Red hand (left) -->

// ── SPEECH RECOGNITION (MIC INPUT) ────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let micInterimText = '';

function initRecognition() {
  if (!SpeechRecognition) return null;
  const r = new SpeechRecognition();
  r.continuous = true;
  r.interimResults = true;
  r.lang = 'en-US';
  r.maxAlternatives = 1;

  r.onstart = () => {
    isListening = true;
    const btn = document.getElementById('micBtn');
    btn.classList.add('listening');
    userInput.placeholder = 'Listening... speak now';
    userInput.value = '';
    micInterimText = '';
  };

  r.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    micInterimText = final || interim;
    userInput.value = micInterimText;
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
  };

  r.onerror = (e) => {
    stopMic();
    if (e.error === 'not-allowed') {
      addBubble("Microphone access was denied. Please allow microphone permission in your browser settings, then try again.", 'ai');
    } else if (e.error === 'no-speech') {
      userInput.placeholder = 'No speech detected — try again or type your response.';
    }
  };

  r.onend = () => {
    if (isListening) {
      // Auto-stopped — send if we got something
      stopMic();
      const text = userInput.value.trim();
      if (text) {
        setTimeout(() => handleSend(), 300);
      } else {
        userInput.placeholder = 'Type or tap 🎤 to speak...';
      }
    }
  };

  return r;
}

function toggleMic() {
  if (!SpeechRecognition) {
    addBubble("Speech recognition isn't supported in this browser. Try Chrome or Safari on your phone.", 'ai');
    return;
  }
  if (isListening) {
    stopMic();
  } else {
    startMic();
  }
}

function startMic() {
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  try {
    recognition.start();
    // Show hint bar
    const hint = document.getElementById('inputHint');
    if (hint) hint.style.display = 'block';
  } catch(e) {
    recognition = initRecognition();
  }
}

function stopMic() {
  isListening = false;
  const btn = document.getElementById('micBtn');
  if (btn) btn.classList.remove('listening');
  if (recognition) { try { recognition.stop(); } catch(e){} }
  userInput.placeholder = 'Type or tap 🎤 to speak...';
}

// ── VOICE TTS ──────────────────────────────────────────────────────────────
let voiceEnabled = false;
const synth = window.speechSynthesis;
let selectedVoice = null;

// Female voice priority list — works across iOS, Android, and desktop
const FEMALE_VOICE_NAMES = [
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Michelle Online (Natural) - English (United States)',
  'Microsoft Emma Online (Natural) - English (United States)',
  'Microsoft Ana Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Sonia Online (Natural) - English (United Kingdom)',
  'Microsoft Libby Online (Natural) - English (United Kingdom)',
  'Microsoft Zira - English (United States)',
  'Samantha',
  'Google US English Female',
  'Microsoft Zira',
];

function loadFemaleVoice() {
  const voices = synth.getVoices();
  if (!voices.length) return;

  console.log('Available voices:', voices.map(v => v.name + (v.default ? ' [DEFAULT]' : '')).join(', '));

  // Match by exact name from priority list — skip system default since it may be male
  for (const name of FEMALE_VOICE_NAMES) {
    const match = voices.find(v => v.name === name);
    if (match) { selectedVoice = match; console.log('✅ Voice selected:', match.name); return; }
  }

  // Fallback: any voice with 'female' in the name
  const femaleFallback = voices.find(v => v.name.toLowerCase().includes('female'));
  if (femaleFallback) { selectedVoice = femaleFallback; console.log('✅ Female fallback:', femaleFallback.name); return; }

  // Last resort: first English voice
  const englishFallback = voices.find(v => v.lang && v.lang.startsWith('en'));
  if (englishFallback) { selectedVoice = englishFallback; console.log('⚠️ English fallback:', englishFallback.name); return; }

  console.log('❌ No voice found.');
}

// Voices load asynchronously on most browsers
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = loadFemaleVoice;
}
// Also try immediately in case voices are already loaded
loadFemaleVoice();

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  // Always reload voices fresh on toggle
  loadFemaleVoice();
  // Sync main start-screen button
  const btn = document.getElementById('voiceToggle');
  if(btn){
    btn.textContent = voiceEnabled ? '🔊 Voice On — Questions Will Be Read Aloud' : '🔇 Voice Off — Tap to Hear Questions Read Aloud';
    btn.classList.toggle('on', voiceEnabled);
  }
  // Sync floating button
  const floatBtn = document.getElementById('voiceFloat');
  if(floatBtn){
    floatBtn.textContent = voiceEnabled ? '🔊' : '🔇';
    floatBtn.classList.toggle('on', voiceEnabled);
  }
  if (voiceEnabled && !selectedVoice) loadFemaleVoice();
}

function showVoiceFloat() {
  const floatBtn = document.getElementById('voiceFloat');
  if(floatBtn) floatBtn.style.display = 'block';
}

function speak(text) {
  if (!voiceEnabled || !synth) return;
  synth.cancel();
  const plain = text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g,' ');
  const utt = new SpeechSynthesisUtterance(plain);
  utt.rate = 0.92;
  utt.pitch = 1.05;
  utt.volume = 1;
  if (selectedVoice) {
    utt.voice = selectedVoice;
    console.log('🔊 Speaking with:', selectedVoice.name);
  } else {
    console.log('⚠️ No voice selected — using browser default');
  }
  synth.speak(utt);
}

  const row=document.createElement('div'); row.className=`bubble-row ${role}`;
  const av=document.createElement('div'); av.className=`avatar ${role}`;
  av.textContent=role==='ai'?'AI':'YOU';
  const bub=document.createElement('div'); bub.className=`bubble ${role}`;
  // SECURITY: user-role bubbles always show exactly what the person typed/said/tapped —
  // they never need real HTML, so we always escape them to prevent stored XSS.
  // AI-role bubbles may contain trusted <strong>/<br> markup we author ourselves.
  const safeText = role==='user' ? escapeHtml(text) : text;
  bub.innerHTML=safeText.replace(/\n/g,'<br>');
  if(role==='user'){row.appendChild(bub);row.appendChild(av);}
  else{row.appendChild(av);row.appendChild(bub);}
  chatWindow.appendChild(row); scrollBottom();
  if(role==='ai') speak(text);
  return bub;
}

// ── AI CLEANUP ─────────────────────────────────────────────────────────────
async function cleanWithAI(rawText, context, fieldType, fieldKey){
  try{
    // Determine subject term based on incident category
    const isEmployeeCase = formData.incidentCategory === 'Employee Misconduct';
    const subjectTerm = isEmployeeCase ? 'employee' : 'subject';
    const subjectTermCapped = isEmployeeCase ? 'The employee' : 'The subject';

    // Build field-specific instruction
    let fieldInstruction = '';
    if(fieldKey === 'guestClothing'){
      fieldInstruction = isEmployeeCase
        ? `This is a UNIFORM description for an employee misconduct report. Describe the uniform professionally in AP Style. Refer to the person as "the employee", never "subject" or "witnesses". Never say "Witnesses included".`
        : 'This is a CLOTHING description. Start with "The subject was wearing" and describe the clothing in AP Style. Hyphenate compound color modifiers (black-and-white). Never say "Witnesses included".';
    } else if(fieldKey === 'guestFeatures'){
      fieldInstruction = `This is a PHYSICAL FEATURES description. List features professionally (e.g. "${subjectTermCapped} had visible tattoos and wore glasses"). Refer to the person as "the ${subjectTerm}". Never say "Witnesses included".`;
    } else if(fieldKey === 'witnesses'){
      fieldInstruction = 'This is a WITNESS LIST. Format as "Witnesses included [name] ([role]) and [name] ([role])." One sentence only.';
    } else if(fieldKey === 'actionTaken'){
      fieldInstruction = 'This is an ACTION TAKEN field. Describe the security action taken in past tense AP Style.';
    } else if(fieldKey === 'environmentalConditions'){
      fieldInstruction = 'This is an ENVIRONMENTAL CONDITIONS field. Describe conditions at the scene professionally.';
    } else if(fieldKey === 'guestStatement' || fieldKey === 'guestStatementDetail'){
      fieldInstruction = `This is a STATEMENT field. Rewrite in AP Style. Refer to the person as "the ${subjectTerm}", never use pronouns.`;
    } else {
      fieldInstruction = `Rewrite in AP Style past tense. Third person only. If referring to the person involved, use "the ${subjectTerm}".`;
    }
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":ANTHROPIC_API_KEY,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:300,
        system: fieldType === 'description'
          ? `You are a professional security report writer for S.A.F.E. Management. Rewrite incident descriptions in AP Style, third person past tense. Never use I, we, she, he, they. ${isEmployeeCase ? 'This is an EMPLOYEE MISCONDUCT report — refer to the person involved as "the employee", never "subject".' : 'Use female subject, male subject, or subject.'} Return ONLY the rewritten text.`
          : `You are a professional security report writer for S.A.F.E. Management. Rewrite field entries in AP Style. ${isEmployeeCase ? 'This is an EMPLOYEE MISCONDUCT report — refer to the person as "the employee", never "subject" or "witnesses".' : "For clothing: start with 'The subject was wearing...'."} For names/witnesses: format as 'Witnesses included [name] ([role])'. Never start with 'Witnesses included' for clothing or uniform fields. Return ONLY the rewritten text.`,
        messages:[{role:"user",content:
          fieldType === 'description'
            ? `Rewrite in professional AP Style past tense third person. Replace: girl=female subject, guy=male subject, slap=strike, fight=physical altercation, went their own ways=departed the area separately. ${isEmployeeCase ? 'Refer to the person involved as "the employee".' : ''} Keep all facts. Return only rewritten text.\n\nInput: ` + rawText
            : fieldInstruction + ' Keep all facts exactly as stated. Return ONLY the rewritten text. No preamble, no labels, no quotation marks.\n\nInput: ' + rawText
        }]
      })
    });
    const d=await r.json();
    console.log('cleanWithAI response:', JSON.stringify(d).slice(0,300));
    if(d.error){ console.error('API error:', d.error.message); return rawText; }
    if(d.type === 'error'){ console.error('API error:', d); return rawText; }
    const result = d.content&&d.content[0]&&d.content[0].text ? d.content[0].text.trim() : null;
    if(!result){ console.error('No content in response'); return rawText; }
    return result;
  }catch(e){console.error('cleanWithAI error:',e); return rawText;}
}

    body += `Safe Ops / Manager Contacted: ${fd.safeOpsContacted||'N/A'}\nContacted: ${fd.safeOpsWho||'N/A'}\n\n`;
    body += `GUEST INFORMATION\n-----------------\n`;
    body += `Name: ${fd.guestName||'Unknown'}\nSeat: ${fd.guestSeat||'N/A'}\nRole/Position: ${fd.guestRole||'N/A'}\n`;

    body += `Height: ${fd.guestHeight||'Unknown'}\nBuild: ${fd.guestBuild||'Unknown'}\n`;
    body += `Hair Color: ${fd.guestHair||'Unknown'}\n`;
    body += `Clothing: ${fd.guestClothing||'Unknown'}\nDistinguishing Features: ${fd.guestFeatures||'Unknown'}\n\n`;
    body += `INCIDENT NARRATIVE\n------------------\n${fd.incidentDescription||'N/A'}\n\n`;
    body += `Guest Statement: ${fd.guestStatement||'N/A'}\n`;
    body += `Guest Statement Detail: ${fd.guestStatementDetail||'N/A'}\n`;
    body += `Witnesses: ${fd.witnesses||'None'}\nAction Taken: ${fd.actionTaken||'N/A'}\n`;
    body += `EMS/Police: ${fd.emsPolice||'N/A'}\nGuest Transported: ${fd.guestTransported||'N/A'}\n\n`;
    body += `FOLLOW-UP\n---------\nRequired: ${fd.followUp||'N/A'}\nDetails: ${fd.followUpDetails||'N/A'}\nRecommendation: ${fd.recommendation||'N/A'}\n\n`;
  } else {
    const empName=`${fd.employeeFirstName||''} ${fd.employeeLastName||''}`.trim();
    body += `RECOGNITION DETAILS\n-------------------\n`;
    body += `Employee: ${empName}\nRole: ${fd.employeeRole||'N/A'}\n\n`;
    body += `Description:\n${fd.recognitionDescription||'N/A'}\n\n`;

  }
  body += `Additional Comments: ${fd.additionalComments||'None'}\n\n`;
  body += `---\nPhysical description provided for identification purposes only.\nThis report is confidential and intended solely for S.A.F.E. Management and Ford Field HR review.`;

  const to = supEmail ? `${hrEmail},${supEmail}` : hrEmail;
  const subject=encodeURIComponent(`[S.A.F.E.] ${title} — ${fd.date}`);
  const encodedBody=encodeURIComponent(body);
  window.location.href=`mailto:${to}?subject=${subject}&body=${encodedBody}`;
}

// ── ANALYTICS TAGS — auto-generated from structured data for future pattern analysis ──
function generateAnalyticsTags(fd){
  const tags = [];
  if(fd.incidentCategory) tags.push(fd.incidentCategory);
  if(fd.incidentLocation){
    const gateMatch = fd.incidentLocation.match(/Gate [A-G]/);
    if(gateMatch) tags.push(gateMatch[0]);
  }
  if(fd.incidentSeverity){
    if(fd.incidentSeverity.includes('Minor')) tags.push('Low Severity');
    else if(fd.incidentSeverity.includes('Moderate')) tags.push('Medium Severity');
    else if(fd.incidentSeverity.includes('Serious')) tags.push('High Severity');
  }
  if(fd.guestName && fd.guestName !== 'Unknown') tags.push('Identified Subject');
  if(fd.guestTransported && fd.guestTransported.includes('EMS')) tags.push('Medical Transport');
  if(fd.emsPolice && !fd.emsPolice.toLowerCase().includes('not applicable')) tags.push('Law Enforcement Involved');
  if(fd.witnesses && fd.witnesses !== 'None') tags.push('Witnesses Present');
  if(fd.cameraCapture && fd.cameraCapture.startsWith('Yes')) tags.push('Camera Footage Available');
  // Day of week tag
  try {
    const dow = new Date(fd.incidentDate||fd.date).toLocaleDateString('en-US',{weekday:'long'});
    if(dow && dow !== 'Invalid Date') tags.push(dow);
  } catch(e){}
  return tags.join(', ');
}

async function submitToSheets(isIncident) {
  return new Promise((resolve) => {
    try {
      const fd = formData;
      const params = new URLSearchParams({
        date: fd.date || '',
        time: fd.time || '',
        incidentDate: fd.incidentDate || fd.date || '',
        incidentTime: fd.incidentTime || fd.time || '',
        venue: fd.venue || '',
        formType: fd.formType || '',
        eventName: fd.eventName || '',
        incidentCategory: fd.incidentCategory || '',
        incidentSeverity: fd.incidentSeverity || '',
        incidentLocation: fd.incidentLocation || '',
        environmentalConditions: fd.environmentalConditions || '',
        cameraCapture: fd.cameraCapture || '',
        cameraZone: fd.cameraZone || '',
        safeOpsContacted: fd.safeOpsContacted || '',
        safeOpsWho: fd.safeOpsWho || '',
        supervisorFirstName: fd.supervisorFirstName || '',
        supervisorLastName: fd.supervisorLastName || '',
        supervisorTitle: fd.supervisorTitle || '',
        supervisorEmail: fd.supervisorEmail || '',
        guestName: fd.guestName || '',
        guestSeat: fd.guestSeat || '',
        guestRole: fd.guestRole || '',
        guestGender: fd.guestGender || '',
        guestAgeRange: fd.guestAgeRange || '',
        guestHeight: fd.guestHeight || '',
        guestBuild: fd.guestBuild || '',
        guestHair: fd.guestHair || '',
        guestHairStyle: fd.guestHairStyle || '',
        guestClothing: fd.guestClothing || '',
        guestFeatures: fd.guestFeatures || '',
        incidentDescription: fd.incidentDescription || '',
        guestStatement: fd.guestStatement || '',
        guestStatementDetail: fd.guestStatementDetail || '',
        witnesses: fd.witnesses || '',
        actionTaken: fd.actionTaken || '',
        emsPolice: fd.emsPolice || '',
        guestTransported: fd.guestTransported || '',
        followUp: fd.followUp || '',
        followUpDetails: fd.followUpDetails || '',
        recommendation: fd.recommendation || '',
        analyticsTags: generateAnalyticsTags(fd),
        employeeName: fd.employeeName || '',
        employeeRole: fd.employeeRole || '',
        recognitionDescription: fd.recognitionDescription || '',
        recognitionImpact: fd.recognitionImpact || '',
        additionalComments: fd.additionalComments || '',
        professionalNarrative: fd.professionalNarrative || '',
        peopleSummary: (fd.people||[]).map(p=>`${p.name} (${p.roleCategory})`).join('; ')
      });

      // Local backup — persists even if the network call to Sheets fails entirely.
      // This is the real safety net: the officer's data is never solely dependent
      // on a successful network round-trip.
      try {
        const backupKey = 'safe_submitted_backup_' + Date.now();
        const backupPayload = Object.fromEntries(params.entries());
        localStorage.setItem(backupKey, JSON.stringify({ payload: backupPayload, savedAt: new Date().toISOString() }));
      } catch(e) { console.error('Local backup failed:', e); }

      // If the device is known offline, don't pretend the network call succeeded
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        console.warn('Device is offline — Sheets submission deferred, local backup retained.');
        resolve(false);
        return;
      }

      // Image ping method — bypasses CORS completely
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(true); // resolve true either way — script ran
      img.src = SHEETS_URL + '?' + params.toString();

      // Safety timeout — resolve after 5 seconds regardless
      setTimeout(() => resolve(true), 5000);

    } catch(err) {
      console.error('Sheets error:', err);
      resolve(false);
    }
  });
}

function showEventPicker(venue, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'event-search-wrap';
  wrap.id = 'eventPicker';

  // Build flat list filtered by venue

  const isFordField = venue && venue.includes('Ford Field');


  let allEvents = [];
  Object.entries(EVENT_SCHEDULE).forEach(([cat, events]) => {


    events.forEach(evt => allEvents.push({cat, evt}));
  });

  // Search box
  const title = document.createElement('div');
  title.style.cssText = 'font-size:13px;color:var(--text-main);font-weight:600;margin-bottom:8px;';
  title.textContent = 'Type to filter events:';
  wrap.appendChild(title);

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'event-search-input';
  input.placeholder = 'e.g. Chris, Lions, Usher, Packers...';
  wrap.appendChild(input);

  const hint = document.createElement('div');
  hint.className = 'event-search-hint';
  hint.textContent = 'List filters instantly as you type — tap any event to select it';
  wrap.appendChild(hint);

  // Results container
  const resultsWrap = document.createElement('div');
  resultsWrap.className = 'event-search-results';
  wrap.appendChild(resultsWrap);

  // Other button
  const otherBtn = document.createElement('button');
  otherBtn.className = 'event-other-btn';
  otherBtn.textContent = '+ Event not listed — type it and tap confirm';
  wrap.appendChild(otherBtn);

  // Confirm button for manual entry
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'cal-confirm-btn';
  confirmBtn.style.cssText = 'margin-top:8px;display:none;';
  confirmBtn.textContent = '✓ Use this event name';
  wrap.appendChild(confirmBtn);

  function renderResults(query) {
    resultsWrap.innerHTML = '';
    const q = (query || '').toLowerCase().trim();
    const filtered = q
      ? allEvents.filter(({evt}) => evt.toLowerCase().includes(q))
      : allEvents;

    if (filtered.length === 0) {
      const none = document.createElement('div');
      none.className = 'event-no-results';
      none.textContent = 'No matches — try different keywords';
      resultsWrap.appendChild(none);
      return;
    }

    let lastCat = '';
    filtered.forEach(({cat, evt}) => {
      if (cat !== lastCat) {
        const catEl = document.createElement('div');
        catEl.className = 'event-result-cat';
        catEl.textContent = cat;
        resultsWrap.appendChild(catEl);
        lastCat = cat;
      }
      const item = document.createElement('div');
      item.className = 'event-result-item';
      item.textContent = evt;
      item.onclick = () => {
        wrap.remove();
        onSelect(evt);
      };
      resultsWrap.appendChild(item);
    });
  }

  // Wire up input — fire on every keystroke
  input.addEventListener('input', function() {
    renderResults(this.value);
  });

  input.addEventListener('keyup', function() {
    renderResults(this.value);
  });

  input.onfocus = function() {
    renderResults(this.value);
  };

  input.onkeydown = function(e) {
    e.stopPropagation();
    if (e.key === 'Enter') e.preventDefault();
  };

  // Other button shows confirm
  otherBtn.onclick = () => {
    input.value = '';
    input.placeholder = 'Type the event name here...';
    confirmBtn.style.display = 'block';
    input.focus();
  };

  confirmBtn.onclick = () => {
    const val = input.value.trim();
    if (val) { wrap.remove(); onSelect(val); }
  };

  // Hide main chat input completely
  inputArea.style.display = 'none';
  document.getElementById('inputHint').style.display = 'none';

  // Show all events initially
  renderResults('');

  chatWindow.appendChild(wrap);
  scrollBottom();

  // Focus after render — longer delay for mobile
  setTimeout(() => { input.focus(); input.click(); }, 300);
}

let uploadedPhotos = []; // array of {name, dataUrl}

function showPhotoUpload(onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'photo-upload-wrap';

  const title = document.createElement('h4');
  title.textContent = 'Attach Photos (Optional)';
  wrap.appendChild(title);

  const dropZone = document.createElement('div');
  dropZone.className = 'photo-drop-zone';
  dropZone.innerHTML = '<div class="icon">📷</div><p>Tap to select photos<br><small>Up to 5 photos · 5MB total</small></p>';

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.multiple = true;
  fileInput.style.cssText = 'position:absolute;width:100%;height:100%;top:0;left:0;opacity:0;cursor:pointer;';

  dropZone.style.position = 'relative';
  dropZone.appendChild(fileInput);
  wrap.appendChild(dropZone);

  const previews = document.createElement('div');
  previews.className = 'photo-previews';
  wrap.appendChild(previews);

  const countEl = document.createElement('div');
  countEl.className = 'photo-count';
  wrap.appendChild(countEl);

  function updatePreviews() {
    previews.innerHTML = '';
    uploadedPhotos.forEach((p, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      const img = document.createElement('img');
      img.src = p.dataUrl;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-photo';
      removeBtn.textContent = '×';
      removeBtn.onclick = (e) => { e.stopPropagation(); uploadedPhotos.splice(i,1); updatePreviews(); };
      thumb.appendChild(img);
      thumb.appendChild(removeBtn);
      previews.appendChild(thumb);
    });
    countEl.textContent = uploadedPhotos.length > 0 ? `${uploadedPhotos.length} photo${uploadedPhotos.length>1?'s':''} attached` : '';
  }

  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files);
    let totalSize = uploadedPhotos.reduce((s,p) => s + p.size, 0);
    for (const file of files) {
      if (uploadedPhotos.length >= 5) { alert('Maximum 5 photos allowed.'); break; }
      if (totalSize + file.size > 5 * 1024 * 1024) { alert('Total photo size cannot exceed 5MB.'); break; }
      const dataUrl = await new Promise(res => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.readAsDataURL(file);
      });
      uploadedPhotos.push({ name: file.name, dataUrl, size: file.size });
      totalSize += file.size;
    }
    updatePreviews();
    scrollBottom();
  };

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'cal-confirm-btn';
  confirmBtn.style.marginTop = '10px';
  confirmBtn.textContent = uploadedPhotos.length > 0 ? '✓ Attach & Continue' : '✓ Continue';
  confirmBtn.onclick = () => {
    wrap.remove();
    onComplete(uploadedPhotos.length > 0 ? `${uploadedPhotos.length} photo(s) attached` : 'No photos attached');
  };
  wrap.appendChild(confirmBtn);

  const skipBtn = document.createElement('button');
  skipBtn.className = 'photo-skip-btn';
  skipBtn.textContent = 'Skip — No photos to attach';
  skipBtn.onclick = () => { uploadedPhotos = []; wrap.remove(); onComplete('No photos attached'); };
  wrap.appendChild(skipBtn);

  chatWindow.appendChild(wrap);
  scrollBottom();
}

// ── SIGNATURE PAD ──────────────────────────────────────────────────────────
function showSignaturePad(onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'sig-pad-wrap';

  const title = document.createElement('h4');
  title.textContent = 'Supervisor Signature';
  wrap.appendChild(title);

  const hint = document.createElement('div');
  hint.className = 'sig-pad-hint';
  hint.textContent = 'Sign with your finger or mouse below to certify this report.';
  wrap.appendChild(hint);

  const canvas = document.createElement('canvas');
  canvas.id = 'sigCanvas';
  canvas.width = 600;
  canvas.height = 140;
  canvas.style.touchAction = 'none';
  wrap.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1A2E4A';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let drawing = false;
  let hasSig = false;
  let totalStrokeDistance = 0;
  let lastPos = null;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
  }

  function trackStroke(p){
    if(lastPos){
      const dx = p.x - lastPos.x, dy = p.y - lastPos.y;
      totalStrokeDistance += Math.sqrt(dx*dx + dy*dy);
    }
    lastPos = p;
  }

  canvas.addEventListener('mousedown', e => { drawing = true; const p = getPos(e); lastPos = p; ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('mousemove', e => { if (!drawing) return; const p = getPos(e); trackStroke(p); ctx.lineTo(p.x, p.y); ctx.stroke(); });
  canvas.addEventListener('mouseup', () => { drawing = false; lastPos = null; });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; const p = getPos(e); lastPos = p; ctx.beginPath(); ctx.moveTo(p.x, p.y); }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!drawing) return; const p = getPos(e); trackStroke(p); ctx.lineTo(p.x, p.y); ctx.stroke(); }, {passive:false});
  canvas.addEventListener('touchend', () => { drawing = false; lastPos = null; });

  const actions = document.createElement('div');
  actions.className = 'sig-pad-actions';

  const clearBtn = document.createElement('button');
  clearBtn.className = 'sig-clear-btn';
  clearBtn.textContent = '✕ Clear';
  clearBtn.onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); totalStrokeDistance = 0; lastPos = null; };
  actions.appendChild(clearBtn);

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'sig-confirm-btn';
  confirmBtn.textContent = '✓ Sign & Complete';
  confirmBtn.onclick = () => {
    // SECURITY/LEGAL: require meaningful drawn distance, not just a tap event,
    // so a blank or near-blank canvas can never be accepted as a valid signature.
    if (totalStrokeDistance < 40) { alert('Please provide a complete signature before continuing — a single tap is not a valid signature.'); return; }
    const sigDataUrl = canvas.toDataURL('image/png');
    wrap.remove();
    onComplete(sigDataUrl);
  };
  actions.appendChild(confirmBtn);
  wrap.appendChild(actions);

  chatWindow.appendChild(wrap);
  scrollBottom();
}

// ── INLINE CLICKABLE WRAPPERS ──────────────────────────────────────────────
function showInlineOptions(options, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.onclick = () => { wrap.remove(); onSelect(opt); };
    wrap.appendChild(btn);
  });
  chatWindow.appendChild(wrap);
  scrollBottom();
}

async function collectPerson(){
  const person = newPerson();

  // 1. Name
  addBubble("What is this person's first name? If you only have their last name, that's fine too.",'ai');
  inputArea.style.display='flex'; awaitingInput=true;
  document.getElementById('inputHint').style.display='block';
  userInput.focus();

  const firstName = await new Promise(resolve => {
    showInlineOptions(['Unknown / Refused'], (val)=>{ sendInterceptor=null; resolve(val==='Unknown / Refused' ? '' : val); });
    sendInterceptor = async(val) => { inputArea.style.display='none'; awaitingInput=false; sendInterceptor=null; resolve(val); };
  });
  inputArea.style.display='none';

  let lastName = '';
  if(firstName){
    showTyping(); await delay(400); removeTyping();
    addBubble(`And their last name?`,'ai');
    inputArea.style.display='flex'; awaitingInput=true; userInput.focus();
    lastName = await new Promise(resolve => {
      showInlineOptions(['Unknown / Refused'], (val)=>{ sendInterceptor=null; resolve(val==='Unknown / Refused' ? '' : val); });
      sendInterceptor = async(val) => { inputArea.style.display='none'; awaitingInput=false; sendInterceptor=null; resolve(val); };
    });
    inputArea.style.display='none';
  }
  // Smart duplicate detection: if the officer already typed the full name in the
  // "first name" field (e.g. "Whitney Jones") and then repeats the last word again
  // in the last name step (e.g. "Jones"), don't concatenate it twice.
  let assembledName = firstName.trim();
  const lastNameTrimmed = lastName.trim();
  if(lastNameTrimmed && !assembledName.toLowerCase().endsWith(lastNameTrimmed.toLowerCase())){
    assembledName = (assembledName + ' ' + lastNameTrimmed).trim();
  }
  person.name = escapeHtml(assembledName || 'Unknown');

  // 2. Role category — the critical structural question
  showTyping(); await delay(400); removeTyping();
  addBubble(`What was ${person.name}'s role in this incident?`,'ai');
  person.roleCategory = await new Promise(resolve => {
    showAppearancePicker(ROLE_CATEGORIES, (val)=>resolve(val), false);
  });

  // 3. If Employee, ask for role/position. Otherwise for non-witness subjects, ask seat.
  if(person.roleCategory === 'Employee'){
    showTyping(); await delay(400); removeTyping();
    addBubble(`What is ${person.name}'s role or position? For example: Event Security, Guest Services, Concessions, Parking, Vendor Staff.`,'ai');
    inputArea.style.display='flex'; awaitingInput=true; userInput.focus();
    person.role = await new Promise(resolve => {
      sendInterceptor = async(val) => { inputArea.style.display='none'; awaitingInput=false; sendInterceptor=null; resolve(escapeHtml(val)); };
    });
    inputArea.style.display='none';
  } else if(SUBJECT_ROLES.includes(person.roleCategory)){
    showTyping(); await delay(400); removeTyping();
    addBubble(`What is ${person.name}'s seat location? Please provide Section, Row, and Seat number.`,'ai');
    person.seatLocation = await new Promise(resolve => {
      showInlineOptions(['Unknown'], (val)=>resolve(val==='Unknown'?'':val));
      inputArea.style.display='flex'; awaitingInput=true; userInput.focus();
      sendInterceptor = async(val) => { inputArea.style.display='none'; awaitingInput=false; sendInterceptor=null; resolve(escapeHtml(val)); };
    });
    inputArea.style.display='none';
    person.seatLocation = person.seatLocation || 'Unknown';
  }

  // 4. Physical appearance — skip for pure Witness role (not usually needed) but offer it
  const wantsAppearance = WITNESS_ROLES.includes(person.roleCategory)
    ? await new Promise(resolve => {
        showTyping();
        addBubble(`Would you like to capture a physical description for ${person.name} as well? This is optional for witnesses.`,'ai');
        showInlineOptions(['Yes, add description','Skip — name and role only'], (val)=>resolve(val.startsWith('Yes')));
      })
    : true;

  if(wantsAppearance){
    showTyping(); await delay(400); removeTyping();
    addBubble(`What is ${person.name}'s gender?`,'ai');
    person.gender = await new Promise(resolve => showAppearancePicker(['Male','Female','Non-binary','Unknown / Not Observed'], resolve, false));

    showTyping(); await delay(300); removeTyping();
    addBubble(`What is ${person.name}'s approximate age range?`,'ai');
    person.ageRange = await new Promise(resolve => showAgeRangePicker(resolve));

    showTyping(); await delay(300); removeTyping();
    addBubble(`How would you describe ${person.name}'s height?`,'ai');
    person.height = await new Promise(resolve => {
      const heightWrap = document.createElement('div');
      heightWrap.className = 'location-picker'; heightWrap.style.margin='4px 0 4px 38px'; heightWrap.style.maxWidth='84%';
      const btnWrap = document.createElement('div'); btnWrap.className='location-options';
      ['Short (under 5\'4")','Average (5\'4"–5\'10")','Tall (5\'11" and above)','Unknown'].forEach(opt=>{
        const btn=document.createElement('button'); btn.className='loc-btn'; btn.textContent=opt;
        btn.onclick=()=>{heightWrap.remove(); resolve(opt);};
        btnWrap.appendChild(btn);
      });
      heightWrap.appendChild(btnWrap);
      chatWindow.appendChild(heightWrap); scrollBottom();
    });

    showTyping(); await delay(300); removeTyping();
    addBubble(`How would you describe ${person.name}'s build?`,'ai');
    person.build = await new Promise(resolve => showAppearancePicker(['Slim / Thin','Medium / Average','Heavyset / Large','Athletic / Muscular','Unknown'], resolve, false));

    showTyping(); await delay(300); removeTyping();
    addBubble(`What is ${person.name}'s hair color?`,'ai');
    person.hairColor = await new Promise(resolve => showAppearancePicker(['Black','Brown','Blonde','Red / Auburn','Gray','White / Silver','Bald','Unknown'], resolve, false));

    showTyping(); await delay(300); removeTyping();
    addBubble(`How would you describe ${person.name}'s hair style?`,'ai');
    person.hairStyle = await new Promise(resolve => showHairStylePicker(resolve));

    showTyping(); await delay(300); removeTyping();
    const clothingLabel = person.roleCategory === 'Employee' ? 'uniform' : 'clothing';
    addBubble(`What was ${person.name} wearing? Describe the ${clothingLabel}.`,'ai');
    const rawClothing = await new Promise(resolve => {
      inputArea.style.display='flex'; awaitingInput=true; userInput.focus();
      sendInterceptor = async(val) => { inputArea.style.display='none'; awaitingInput=false; sendInterceptor=null; resolve(val); };
    });
    // AP Style cleanup for clothing, same dedicated handler logic as before
    showTyping(); await delay(300);
    speak("Writing that up in professional language"); addBubble("Writing that up in professional language...","ai");
    const genderRef = person.gender && person.gender.toLowerCase().includes('female') ? `The female ${person.roleCategory==='Employee'?'employee':'subject'}` : person.gender && person.gender.toLowerCase().includes('male') ? `The male ${person.roleCategory==='Employee'?'employee':'subject'}` : `The ${person.roleCategory==='Employee'?'employee':'subject'}`;
    try {
      const cr = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:150,
          system:`You rewrite clothing descriptions for security reports. Always start with "${genderRef} was wearing" followed by the items in AP Style. Hyphenate compound color modifiers. Return only the rewritten sentence.`,
          messages:[{role:"user",content:`Rewrite this clothing description: ${rawClothing}`}]
        })
      });
      const cd = await cr.json();
      person.clothing = cd.content&&cd.content[0] ? cd.content[0].text.trim() : `${genderRef} was wearing ${escapeHtml(rawClothing)}.`;
    } catch(e){ person.clothing = `${genderRef} was wearing ${escapeHtml(rawClothing)}.`; }
    removeTyping();
    addBubble(`Here's how it will read: <em>"${person.clothing}"</em>`,'ai');
    await delay(600);

    showTyping(); await delay(300); removeTyping();
    addBubble(`Any distinguishing features for ${person.name}? Select all that apply.`,'ai');
    person.features = await new Promise(resolve => {
      showAppearancePicker(['Tattoos visible','Facial hair (beard/mustache)','Glasses','Hat or cap','Mask or face covering','Scar or birthmark','None observed'], resolve, true);
    });

    showTyping(); await delay(300); removeTyping();
    addBubble(`Do you have any photos of ${person.name}? Upload up to 3 photos.`,'ai');
    await new Promise(resolve => {
      showPhotoUpload(async(result)=>{
        person.photoDataUrls = uploadedPhotos.map(p=>p.dataUrl);
        const captureTime = new Date().toLocaleString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const officerName = `${formData.supervisorFirstName||''} ${formData.supervisorLastName||''}`.trim() || 'Unknown';
        person.photoMeta = uploadedPhotos.map(() => ({ captured: captureTime, takenBy: officerName }));
        uploadedPhotos = [];
        resolve();
      });
    });
  }

  // 5. Statement — ask for everyone regardless of role (subjects, witnesses, employees all may have something to say)
  showTyping(); await delay(300); removeTyping();
  addBubble(`What did ${person.name} say, if anything? This becomes part of the official record.`,'ai');
  person.statement = await new Promise(resolve => {
    showInlineOptions(['Refused to Speak','Uncooperative','Nothing said'], (val)=>resolve(val));
    inputArea.style.display='flex'; awaitingInput=true; userInput.focus();
    sendInterceptor = async(val) => {
      inputArea.style.display='none'; awaitingInput=false; sendInterceptor=null;
      const lower = val.toLowerCase().trim();
      if(['refused to speak','uncooperative','nothing said'].includes(lower)){ resolve(val); return; }
      // AP Style cleanup for statement
      showTyping(); await delay(300);
      speak("Writing that up in professional language"); addBubble("Writing that up in professional language...","ai");
      const ctx = `Statement field for ${person.name} (${person.roleCategory}) in a ${formData.incidentCategory||'incident'} report.`;
      const cleaned = await cleanWithAI(val, ctx, 'field', 'guestStatement');
      removeTyping();
      addBubble(`Here's how it will read: <em>"${cleaned}"</em>`,'ai');
      await delay(500);
      resolve(cleaned);
    };
  });

  return person;
}

async function runPeopleLoop(){
  inputArea.style.display='none';
  let addingMore = true;
  let isFirst = true;

  while(addingMore){
    if(!isFirst){
      const choice = await new Promise(resolve => {
        showInlineOptions(['➕ Add Another Person','✓ Done Adding People'], (val)=>resolve(val));
      });
      if(choice.startsWith('✓')) break;
      addBubble(choice,'user');
    }
    isFirst = false;

    const person = await collectPerson();

    // Ambiguity check: if this person's name matches an existing person who
    // already has a different role, or if the officer's narrative elsewhere
    // suggests dual involvement, don't guess — ask directly.
    const existing = formData.people.find(p => p.name.toLowerCase() === person.name.toLowerCase() && p.name.toLowerCase() !== 'unknown');
    if(existing && existing.roleCategory !== person.roleCategory){
      showTyping(); await delay(400); removeTyping();
      addBubble(`I see ${person.name} was already listed as <strong>${existing.roleCategory}</strong>. Was ${person.name} ${existing.roleCategory.toLowerCase()}, ${person.roleCategory.toLowerCase()}, or both?`,'ai');
      const resolution = await new Promise(resolve => {
        showInlineOptions([existing.roleCategory + ' only', person.roleCategory + ' only', 'Both roles apply'], (val)=>resolve(val));
      });
      addBubble(resolution,'user');
      if(resolution === 'Both roles apply'){
        // Keep both entries — dual role explicitly confirmed by the officer
        formData.people.push(person);
      } else if(resolution.startsWith(person.roleCategory)){
        // Replace the existing entry's role with the new one, drop the duplicate
        existing.roleCategory = person.roleCategory;
      }
      // else: keep existing as-is, discard the new duplicate entry
    } else {
      formData.people.push(person);
    }

    showTyping(); await delay(300); removeTyping();
    addBubble(`Got it — ${person.name} added.`,'ai');
  }

  // Backward-compat: also populate the legacy flat guest fields from the first subject-role person
  const firstSubject = getSubjectPeople()[0];
  if(firstSubject){
    formData.guestName = firstSubject.name;
    formData.guestRole = firstSubject.role;
    formData.guestGender = firstSubject.gender;
    formData.guestAgeRange = firstSubject.ageRange;
    formData.guestHeight = firstSubject.height;
    formData.guestBuild = firstSubject.build;
    formData.guestHair = firstSubject.hairColor;
    formData.guestHairStyle = firstSubject.hairStyle;
    formData.guestClothing = firstSubject.clothing;
    formData.guestFeatures = firstSubject.features;
    formData.guestSeat = firstSubject.seatLocation;
    formData.guestStatement = firstSubject.statement;
    formData.guestPhotoDataUrls = firstSubject.photoDataUrls;
    formData.guestPhotoMeta = firstSubject.photoMeta;
    formData.guestPhotos = firstSubject.photoDataUrls.length > 0 ? `${firstSubject.photoDataUrls.length} photo(s) attached` : 'No photos attached';
  }
  // Build legacy witnesses summary text from witness-role people, for any code path that still reads formData.witnesses
  const witnessPeople = getWitnessPeople();
  formData.witnesses = witnessPeople.length > 0
    ? 'Witnesses included ' + witnessPeople.map(p => `${p.name}${p.role?', '+p.role:''}`).join(', and ') + '.'
    : 'None';

  flowIndex++; await askNextQuestion();
}

async function askNextQuestion(){
  while(flowIndex<activeFlow.length){
    const step=activeFlow[flowIndex];
    if(step.skipIf&&step.skipIf(formData)){flowIndex++;continue;}
    break;

  updateProgress();
  saveDraft();
  if(flowIndex>=activeFlow.length){await showFinalForm();return;}
  const step=activeFlow[flowIndex];
  showTyping(); await delay(800); removeTyping();
  const askText = typeof step.ask === 'function' ? step.ask() : step.ask;

async function processAnswer(raw){
  inputArea.style.display='none';
  document.getElementById('inputHint').style.display='none';
  stopMic();
  awaitingInput=false;
  const step=activeFlow[flowIndex]; const key=step.key;
  const skipWords=['skip',"don't know","i don't know",'unknown','not sure','n/a'];
  const isSkip=skipWords.some(w=>raw.toLowerCase().includes(w));

  // venue routing
  if(key==='venue'){
    formData.venue='Ford Field, Detroit, Michigan'; // confirmed by officer

  // formType routing
  if(key==='formType'){
    formData[key]=raw;
    incidentType=raw.includes('Incident')?'incident':'recognition';

    flowIndex=0; await askNextQuestion(); return;
  }

  // Email field with remember option
  if(step.isEmail){

      remRow.innerHTML=`<input type="checkbox" id="rememberEmail" checked> <label for="rememberEmail">Remember my email for next time</label>`;
      chatWindow.appendChild(remRow); scrollBottom();
      await delay(200);
      const cb=document.getElementById('rememberEmail');
      setTimeout(()=>{
        if(!cb.checked) localStorage.removeItem('safe_supervisor_email');
        flowIndex++; askNextQuestion();
      },1500);
      cb.addEventListener('change',()=>{
        if(cb.checked) localStorage.setItem('safe_supervisor_email',raw);
        else localStorage.removeItem('safe_supervisor_email');
      });
    } else {
      formData[key]='Not provided'; flowIndex++; await askNextQuestion();
    }
    return;

  // actionTaken Other — reveal text input
  if(key==='actionTaken' && raw==='Other — specify'){
    showTyping(); await delay(400); removeTyping();
    addBubble('Please describe the action taken:','ai');
    inputArea.style.display='flex'; awaitingInput=true;
        sendInterceptor=async(val)=>{

        else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{formData.actionTaken=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
        else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
      });
    };
    return;
  }

  // guestSeat typed
  if(key==='guestSeat'){
    formData[key]=isSkip?'Unknown':raw;
    flowIndex++; await askNextQuestion(); return;
  }

  // witnesses typed
  if(key==='witnesses'){
    if(isSkip){ formData[key]='None'; flowIndex++; await askNextQuestion(); return; }
    const ctx=`Incident report witness field for ${formData.venue}.`;
    const witnessPrompt = 'Rewrite in professional AP Style as a witness list. ' +
      'Format: "Witnesses included [name], [role], and [name], [role]." ' +
      'One sentence maximum. No date references. No preamble. Return only the rewritten text.\n\nInput: ' + raw;
    showTyping(); await delay(300);
    speak("Writing that up in professional language"); addBubble("Writing that up in professional language...","ai");
    const r2=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:150,
        system:"You are a professional security report writer. Format witness lists concisely. Return ONLY the formatted text.",
        messages:[{role:"user",content:witnessPrompt}]})
    });
    const d2=await r2.json();
    const cleaned=d2.content&&d2.content[0]?d2.content[0].text.trim():raw;
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this look right?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{formData[key]=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
      else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  // emsPolice typed
  if(key==='emsPolice'){
    if(isSkip||raw.toLowerCase().includes('not applicable')){formData[key]='Not applicable';flowIndex++;await askNextQuestion();return;}
    const ctx=`Incident report EMS/police involvement field for ${formData.venue}.`;
    const cleaned=await cleanWithAI(raw,ctx,'field');
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this look right?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{formData[key]=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
      else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  // additionalComments typed
  if(key==='additionalComments'){
    if(isSkip){ formData[key]='None'; flowIndex++; await askNextQuestion(); return; }
    const ctx=`Incident report additional comments field for ${formData.venue}.`;
    const cleaned=await cleanWithAI(raw,ctx,'field');
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this look right?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{formData[key]=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
      else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  // Guest name special handling
  if(key==='guestName'){
    const firstName = raw;
    showTyping(); await delay(400); removeTyping();
    addBubble("And the guest's last name? If you don't have it or the guest refused, tap below.","ai");

    const finishName = async(lastName) => {
      sendInterceptor = null;
      formData.guestName = escapeHtml(lastName ? `${firstName} ${lastName}`.trim() : firstName);
      flowIndex++; await askNextQuestion();
    };

    showInlineOptions(['Unknown / Guest Refused'], async()=>{
      inputArea.style.display='none'; awaitingInput=false;
      sendInterceptor = null;
      addBubble('Unknown / Guest Refused','user');
      await finishName('');
    });

    inputArea.style.display='flex'; awaitingInput=true;
    document.getElementById('inputHint').style.display='block';
    userInput.focus();

    sendInterceptor = async(ln) => {
      inputArea.style.display='none'; awaitingInput=false;
      await finishName(ln);
    };
    return;
  }

  // Pre-defined tap selections — skip AI cleanup entirely
  const preDefinedValues = [
    'Refused to Speak','Uncooperative','None','Not applicable',
    '✅ Confirmed — Ford Field, Detroit',
    'No Action Taken','No — not captured','No — not contacted','No recommendation',
    'No — incident resolved','Yes — follow-up needed',
    'Verbal Warning','Written Warning','Ejection from Venue',
    'Referred to Guest Services','Suspension','Termination',
    'EMS Called','Detroit PD Called',
    'Minor — Resolved on scene','Moderate — Required additional response',
    'Serious — EMS / Police / Management involved',
    'Yes — captured on surveillance','Safe Ops was monitoring',
    'Unknown / Not confirmed','Yes — contacted Safe Ops',
    'Yes — contacted my manager','Both contacted',
    'Male','Female','Non-binary','Unknown / Not Observed',
    'Slim / Thin','Medium / Average','Heavyset / Large','Athletic / Muscular',
    'Yes — transported by EMS','Yes — left on their own',
    'No — remained on site','Not applicable',
    'No photos attached','1 photo(s) attached','2 photo(s) attached','3 photo(s) attached',
    'Hat or cap','None observed','Incident Report','Employee Recognition',
    'Guest Altercation','Slip / Fall / Medical','Intoxication / Ejection',
    'Employee Misconduct','Unauthorized Access','Theft / Property Damage',
    'Lost Person / Child','Other','Just now','Earlier today','Yesterday',
  ];
  const rawLower = raw.toLowerCase().trim();
  const isPreDefined = preDefinedValues.some(v => v.toLowerCase() === rawLower) ||
    rawLower === 'refuse to speak' || rawLower === 'none' || rawLower === 'n/a' ||
    raw.startsWith('📍') || raw.startsWith('✅') || raw.startsWith('📅');
  if(isPreDefined){
    if(rawLower.includes('refuse') || rawLower.includes('refused')) formData[key] = 'Refused to Speak';
    else formData[key] = raw;
    flowIndex++; await askNextQuestion();
    return;
  }

  // Clothing field — handle separately with rule-based + targeted AI prompt
  if(key === 'guestClothing'){
    showTyping(); await delay(300);
    speak("Writing that up in professional language"); addBubble("Writing that up in professional language...","ai");
    // Determine gender from formData for proper subject reference
    const genderRef = formData.guestGender && formData.guestGender.toLowerCase().includes('female')
      ? 'The female subject' : formData.guestGender && formData.guestGender.toLowerCase().includes('male')
      ? 'The male subject' : 'The subject';
    try {
      const cr = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:150,
          system:`You rewrite clothing descriptions for security reports. Always start with "${genderRef} was wearing" followed by the clothing items in AP Style. Hyphenate compound color modifiers (black-and-white). List items separated by commas. Never use "Witnesses included". Return only the rewritten sentence.`,
          messages:[{role:"user",content:`Rewrite this clothing description: ${raw}`}]

          userInput.style.height=Math.min(userInput.scrollHeight,110)+'px';
          inputArea.style.display='flex'; awaitingInput=true;
          sendInterceptor=async(_intercepted)=>{
            const edited=_intercepted.trim();
            if(!edited){flowIndex++;await askNextQuestion();return;}
            formData[key]=edited; inputArea.style.display='none'; awaitingInput=false;
            sendInterceptor=null; flowIndex++;await askNextQuestion();
          };
        }
        else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
      });
    } catch(e) {
      const fallback = `${genderRef} was wearing ${raw}.`;
      formData[key]=fallback; flowIndex++; await askNextQuestion();
    }
    return;
  }

  // Auto-correct guest name spelling in raw text before AI cleanup
  if(formData.guestName && formData.guestName !== 'Unknown' && raw.length > 0){
    const guestNameParts = formData.guestName.trim().split(' ').filter(p=>p.length>2);
    guestNameParts.forEach(namePart => {
      // Fix double-letter variations (Chartell → Chartel, Perrry → Perry)
      const lastChar = namePart.slice(-1);
      const doubleRegex = new RegExp(namePart.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,-1) + lastChar + '+', 'gi');
      raw = raw.replace(doubleRegex, namePart);
      // Fix case variations
      const caseRegex = new RegExp(namePart.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
      raw = raw.replace(caseRegex, namePart);
    });
  }

  // AP Style cleanup — triggers on ANY typed field with more than 3 words (full stop, no exceptions)
  const wordCount = raw.trim().split(/\s+/).filter(w=>w.length>0).length;
  const isPreDefinedTapValue = preDefinedValues.some(v => v.toLowerCase() === rawLower);
  if(wordCount>3 && !isSkip && !isPreDefinedTapValue && key!=='guestClothing' && key!=='witnesses'){

    const ctx=`This is a ${incidentType==='incident'?formData.incidentCategory+' incident':'employee recognition'} report for ${formData.venue}.`;
    const descriptionFields = ['incidentDescription','guestStatement','guestStatementDetail','recognitionDescription','recognitionImpact'];
    const fieldType = descriptionFields.includes(key) ? 'description' : 'field';
    const cleaned=await cleanWithAI(raw,ctx,fieldType,key);
    removeTyping(); showTyping(); await delay(500); removeTyping();
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this accurately capture what happened?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit — change a word or two','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){
        showTyping(); await delay(400); removeTyping();

        userInput.value=cleaned;
        userInput.style.height='auto';
        userInput.style.height=Math.min(userInput.scrollHeight,110)+'px';
        inputArea.style.display='flex'; awaitingInput=true;
        sendInterceptor=async(_intercepted)=>{
          const edited=_intercepted.trim();
          if(!edited){ flowIndex++; await askNextQuestion(); return; }
          formData[key]=edited; inputArea.style.display='none'; awaitingInput=false;
          sendInterceptor=null;
          flowIndex++; await askNextQuestion();
        };
      }
      else{addBubble("No problem — describe it again and I'll rewrite it.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  formData[key]=isSkip?'Unknown / Not Available':raw;
  flowIndex++; await askNextQuestion();
}

    const narrativePrompt = `You are a professional security documentation specialist for S.A.F.E. Management at Ford Field, Detroit.

Using ONLY the information provided below, write a single cohesive professional incident narrative in AP Style. Third person, past tense. Do not add any facts not listed. Do not use bullet points. Write 2-3 paragraphs maximum. Make it read as a court-ready security report.
