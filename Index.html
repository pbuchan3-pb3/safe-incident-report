<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>S.A.F.E. | Incident Report</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;800&display=swap');
  :root {
    --safe-red:#E8192C; --safe-navy:#1A2E4A; --safe-blue:#1B4B8A;
    --safe-silver:#C8CDD4; --white:#fff; --light-bg:#f4f7fb;
    --accent:#E8192C; --lions-blue:#1B4B8A; --lions-dark:#1A2E4A;
    --lions-silver:#C8CDD4; --user-bubble:#1B4B8A;
    --text-main:#1A2E4A; --text-muted:#6b7280;
    --border:#dde3ec; --success:#10b981; --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Inter',sans-serif;background:var(--light-bg);color:var(--text-main);display:flex;flex-direction:column;height:100%;}

  header{background:var(--safe-navy);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--safe-red);flex-shrink:0;}

  /* HERO IMAGE STRIP */
  .hero-strip{position:relative;height:130px;overflow:hidden;flex-shrink:0;display:flex;align-items:flex-end;padding:0 16px 14px;}
  .hero-strip-bg{position:absolute;inset:0;background:
    linear-gradient(to bottom, rgba(26,46,74,0.6) 0%, rgba(26,46,74,0.95) 100%),
    repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(255,255,255,0.03) 38px, rgba(255,255,255,0.03) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 58px, rgba(255,255,255,0.02) 58px, rgba(255,255,255,0.02) 60px),
    linear-gradient(135deg, #0d1f3c 0%, #1a3a6b 40%, #0d1f3c 70%, #1a2e4a 100%);
    animation:heroZoom 20s ease-in-out infinite alternate;}
  /* Stadium lights effect */
  .hero-strip-bg::before{content:'';position:absolute;inset:0;background:
    radial-gradient(ellipse at 20% 0%, rgba(232,25,44,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 0%, rgba(232,25,44,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.08) 0%, transparent 40%);}
  @keyframes heroZoom{from{opacity:.9;}to{opacity:1;}}
  .hero-strip-content{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;width:100%;}
  .hero-venue{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;line-height:1;}
  .hero-venue span{color:var(--safe-red);}
  .hero-season{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--safe-silver);margin-top:2px;}
  .hero-badge{background:var(--safe-red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:4px;}

  /* PROGRESS BAR */
  .progress-wrap{background:rgba(26,46,74,0.97);border-bottom:1px solid rgba(232,25,44,0.3);padding:7px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;backdrop-filter:blur(8px);}
  .progress-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--safe-red);white-space:nowrap;}
  .progress-track{flex:1;height:3px;background:rgba(200,205,212,0.15);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--safe-red),#ff4d5e);border-radius:3px;transition:width .4s ease;}
  .progress-pct{font-size:10px;font-weight:600;color:var(--safe-silver);white-space:nowrap;min-width:28px;text-align:right;}
  .header-left{display:flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .header-logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;color:var(--safe-red);letter-spacing:2px;line-height:1;}
  .header-tagline{font-size:9px;font-weight:700;color:var(--safe-silver);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
  .header-season{display:flex;flex-direction:column;align-items:center;line-height:1;padding:0 2px;}
  .season-year{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:var(--safe-red);letter-spacing:2px;line-height:1;}
  .season-motto{font-size:8px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;margin-top:2px;}
  .header-divider{width:2px;height:30px;background:var(--safe-silver);opacity:.4;flex-shrink:0;}
  .header-info h1{font-size:12px;font-weight:600;color:#fff;letter-spacing:.5px;}
  .header-info p{font-size:10px;color:var(--safe-silver);margin-top:1px;}
  .header-badge{margin-left:auto;background:var(--safe-red);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

  .timestamp-bar{background:var(--safe-red);color:#fff;text-align:center;font-size:11px;font-weight:500;padding:6px;letter-spacing:.3px;flex-shrink:0;}

  .main{flex:1;display:flex;flex-direction:column;max-width:680px;width:100%;margin:0 auto;min-height:0;}

  .chat-window{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:scroll;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
  .chat-window::-webkit-scrollbar{width:6px;}
  .chat-window::-webkit-scrollbar-thumb{background:#C8CDD4;border-radius:4px;}
  .chat-window::-webkit-scrollbar-thumb:hover{background:#1A2E4A;}

  .welcome-card{background:var(--safe-navy);border-radius:16px;padding:22px 18px;color:#fff;border-left:4px solid var(--safe-red);box-shadow:0 4px 20px rgba(0,0,0,0.15);}
  .welcome-card h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--safe-red);margin-bottom:8px;}
  .welcome-card p{font-size:13px;line-height:1.6;color:var(--safe-silver);}
  .start-btn{margin-top:10px;background:var(--safe-red);color:#fff;border:none;padding:12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:background .2s;}
  .start-btn:hover{background:#b5121f;}
  .voice-btn{margin-top:14px;background:transparent;border:2px solid var(--safe-silver);color:var(--safe-silver);padding:11px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:all .2s;text-align:center;}
  .voice-btn.on{background:rgba(232,25,44,.15);border-color:var(--safe-red);color:var(--safe-red);}

  /* Floating persistent voice toggle */
  .voice-float{position:fixed;bottom:90px;right:14px;z-index:999;background:#fff;border:2px solid var(--border);border-radius:50px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);transition:all .2s;color:var(--text-muted);display:none;}
  .voice-float.on{background:rgba(232,25,44,.1);border-color:var(--safe-red);color:var(--safe-red);}
  .voice-float:hover{box-shadow:0 4px 16px rgba(0,0,0,.2);}

  .bubble-row{display:flex;gap:8px;align-items:flex-end;}
  .bubble-row.user{flex-direction:row-reverse;}
  .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .avatar.ai{background:var(--safe-navy);color:#fff;}
  .avatar.user{background:var(--safe-red);color:#fff;}
  .bubble{max-width:84%;padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.6;}
  .bubble.ai{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text-main);box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .bubble.user{background:var(--safe-navy);color:#fff;border-bottom-right-radius:4px;}

  .quick-replies{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 4px 38px;}
  .qr-btn{background:#fff;border:2px solid var(--safe-navy);color:var(--safe-navy);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;}
  .qr-btn:hover,.qr-btn.selected{background:var(--safe-navy);color:#fff;}
  .skip-note{font-size:11px;color:var(--text-muted);padding:2px 0 0 38px;font-style:italic;}

  .typing{display:flex;gap:4px;padding:13px 15px;background:#fff;border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;width:fit-content;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--safe-red);animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}

  .input-area{background:#fff;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
  .input-area textarea{flex:1;border:2px solid var(--border);border-radius:12px;padding:10px 13px;font-family:'Inter',sans-serif;font-size:15px;resize:none;min-height:44px;max-height:110px;outline:none;transition:border-color .2s;line-height:1.5;}
  .input-area textarea:focus{border-color:var(--safe-navy);}
  .input-area textarea::placeholder{color:var(--text-muted);}
  .send-btn{background:var(--safe-navy);border:none;border-radius:10px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;}
  .send-btn:hover{background:#111e2e;}
  .send-btn svg{width:18px;height:18px;fill:#fff;}

  /* FORM PREVIEW — mobile optimized */
  .form-preview{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:18px;margin:4px 0;}
  .form-preview h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:1px;color:var(--safe-navy);border-bottom:2px solid var(--safe-red);padding-bottom:8px;margin-bottom:14px;}
  .form-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin:14px 0 6px;border-top:1px solid var(--border);padding-top:10px;}
  .form-field{margin-bottom:10px;}
  .form-field label{font-weight:700;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
  .form-field span{color:var(--text-main);font-size:15px;line-height:1.5;display:block;}
  .form-field span.unknown{color:var(--text-muted);font-style:italic;}
  .disclaimer{font-size:11px;color:var(--text-muted);border-top:1px solid var(--border);margin-top:12px;padding-top:10px;font-style:italic;line-height:1.5;}

  .submit-btn{width:100%;margin-top:10px;background:var(--success);color:#fff;border:none;padding:14px;border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px;}
  .submit-btn:hover{background:#059669;}
  .submit-btn:disabled{background:var(--border);cursor:not-allowed;}
  .download-pdf-btn{width:100%;margin-top:14px;background:var(--safe-navy);color:#fff;border:none;padding:14px;border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px;}
  .download-pdf-btn:hover{background:#111e2e;}

  .email-status{margin-top:10px;padding:12px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;display:none;}
  .email-status.sending{background:#dbeafe;color:#1e40af;display:block;}
  .email-status.sent{background:#d1fae5;color:#065f46;display:block;}
  .email-status.error{background:#fee2e2;color:#991b1b;display:block;}

  /* Remember email checkbox */
  .remember-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--text-muted);}
  .remember-row input{width:16px;height:16px;cursor:pointer;}

  @media(max-width:480px){
    .bubble{font-size:15px;}
    .form-field span{font-size:15px;}
  }

  /* LOCATION PICKER */
  .location-picker{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .location-category{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--border);}
  .location-category:first-child{margin-top:0;padding-top:0;border-top:none;}
  .location-options{display:flex;flex-wrap:wrap;gap:6px;}
  .loc-btn{background:var(--light-bg);border:1.5px solid var(--border);color:var(--text-main);padding:8px 12px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;text-align:left;}
  .loc-btn:hover,.loc-btn.selected{background:var(--safe-navy);border-color:var(--safe-navy);color:#fff;}

  /* MIC BUTTON */
  .mic-btn{background:var(--lions-dark);border:2px solid var(--safe-silver);border-radius:10px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;position:relative;}
  .mic-btn svg{width:20px;height:20px;fill:var(--safe-silver);transition:fill .2s;}
  .mic-btn.listening{background:var(--danger,#ef4444);border-color:#ef4444;animation:micPulse 1s infinite;}
  .mic-btn.listening svg{fill:#fff;}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4);}50%{box-shadow:0 0 0 8px rgba(239,68,68,0);}}
  .mic-status{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--danger,#ef4444);white-space:nowrap;display:none;}
  .mic-btn.listening .mic-status{display:block;}
  .input-hint{font-size:11px;color:var(--text-muted);text-align:center;padding:4px 16px 6px;flex-shrink:0;background:#fff;border-top:none;}

  /* EVENT SEARCH PICKER */
  .event-search-wrap{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .event-search-input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:border-color .2s;color:var(--text-main);}
  .event-search-input:focus{border-color:var(--safe-navy);}
  .event-search-input::placeholder{color:var(--text-muted);}
  .event-search-hint{font-size:11px;color:var(--text-muted);font-style:italic;margin:6px 0 10px;text-align:center;}
  .event-search-results{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
  .event-search-results::-webkit-scrollbar{width:3px;}
  .event-search-results::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .event-result-item{padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--light-bg);font-size:13px;font-weight:500;color:var(--text-main);cursor:pointer;transition:all .15s;line-height:1.4;}
  .event-result-item:hover,.event-result-item.selected{background:var(--safe-navy);border-color:var(--safe-navy);color:#fff;}
  .event-result-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin:8px 0 4px;}
  .event-no-results{text-align:center;color:var(--text-muted);font-size:13px;font-style:italic;padding:12px 0;}
  .event-other-btn{width:100%;margin-top:10px;background:transparent;border:2px dashed var(--border);color:var(--text-muted);padding:10px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
  .event-other-btn:hover{border-color:var(--safe-navy);color:var(--safe-navy);}
  .datetime-picker{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:16px;margin:4px 0 4px 38px;max-width:84%;}
  .datetime-picker h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin-bottom:12px;}
  .calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav{background:var(--safe-navy);color:#fff;border:none;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .cal-month-label{font-weight:700;font-size:14px;color:var(--safe-navy);}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px;}
  .cal-day-header{text-align:center;font-size:10px;font-weight:700;color:var(--text-muted);padding:4px 0;}
  .cal-day{text-align:center;padding:7px 4px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;border:1.5px solid transparent;}
  .cal-day:hover{background:var(--light-bg);border-color:var(--safe-navy);}
  .cal-day.selected{background:var(--safe-navy);color:#fff;border-color:var(--safe-navy);}
  .cal-day.today{border-color:var(--safe-red);color:var(--safe-red);font-weight:700;}
  .cal-day.today.selected{background:var(--safe-red);color:#fff;border-color:var(--safe-red);}
  .cal-day.other-month{color:var(--border);cursor:default;}
  .cal-day.future{color:var(--border);cursor:not-allowed;}
  .time-picker{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
  .time-select{flex:1;padding:8px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text-main);outline:none;}
  .time-select:focus{border-color:var(--safe-navy);}
  .time-separator{font-weight:700;color:var(--safe-navy);font-size:18px;}
  .time-ampm{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text-main);outline:none;}
  .time-approx-note{font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:12px;}
  .cal-confirm-btn{width:100%;background:var(--safe-red);color:#fff;border:none;border-radius:8px;padding:11px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;}
  .cal-confirm-btn:hover{background:#b5121f;}
  .cal-confirm-btn:disabled{background:var(--border);cursor:not-allowed;}

  /* PHOTO THUMBNAILS IN REPORT */
  .report-photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .report-photo-thumb{width:90px;height:90px;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer;}
  .report-photo-thumb:hover{border-color:var(--safe-navy);}
  .report-photo-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--safe-red);margin:8px 0 4px;}

  /* PHOTO UPLOAD */
  .photo-upload-wrap{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .photo-upload-wrap h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin-bottom:10px;}
  .photo-drop-zone{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:10px;}
  .photo-drop-zone:hover,.photo-drop-zone.drag-over{border-color:var(--safe-navy);background:var(--light-bg);}
  .photo-drop-zone p{font-size:13px;color:var(--text-muted);margin-top:6px;}
  .photo-drop-zone .icon{font-size:28px;}
  .photo-previews{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .photo-thumb{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:2px solid var(--border);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb .remove-photo{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .photo-count{font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:8px;}
  .photo-skip-btn{background:transparent;border:2px dashed var(--border);color:var(--text-muted);padding:10px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%;transition:all .2s;margin-top:4px;}
  .photo-skip-btn:hover{border-color:var(--safe-navy);color:var(--safe-navy);}

  /* SIGNATURE PAD */
  .sig-pad-wrap{background:#fff;border:2px solid var(--safe-navy);border-radius:16px;padding:14px;margin:4px 0 4px 38px;max-width:84%;}
  .sig-pad-wrap h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--safe-red);margin-bottom:6px;}
  .sig-pad-hint{font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:10px;}
  #sigCanvas{width:100%;height:140px;border:2px solid var(--border);border-radius:10px;touch-action:none;cursor:crosshair;background:#fafafa;display:block;}
  .sig-pad-actions{display:flex;gap:8px;margin-top:8px;}

<script>
// ── API CONFIGURATION ──────────────────────────────────────────────────────
// To use AI features, set your Anthropic API key below:
const ANTHROPIC_API_KEY = window.ANTHROPIC_API_KEY || ['sk-ant-api03-xa5WcCw','jEeb_yt6EbteqT6AIjzp','Iizz06CS3_gH_p6UgVF2G1J3BJpdnSc8a0GwdUcySrBW-42CtU3ob84YIzg-KYQAcwAA'].join('');

// ── SPEECH RECOGNITION (MIC INPUT) ────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let micInterimText = '';

function initRecognition() {
  if (!SpeechRecognition) return null;
  const r = new SpeechRecognition();
  r.continuous = true;
  r.interimResults = true;
  r.lang = 'en-US';
  r.maxAlternatives = 1;

  r.onstart = () => {
    isListening = true;
    const btn = document.getElementById('micBtn');
    btn.classList.add('listening');
    userInput.placeholder = 'Listening... speak now';
    userInput.value = '';
    micInterimText = '';
  };

  r.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    micInterimText = final || interim;
    userInput.value = micInterimText;
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
  };

  r.onerror = (e) => {
    stopMic();
    if (e.error === 'not-allowed') {
      addBubble("Microphone access was denied. Please allow microphone permission in your browser settings, then try again.", 'ai');
    } else if (e.error === 'no-speech') {
      userInput.placeholder = 'No speech detected — try again or type your response.';
    }
  };

  r.onend = () => {
    if (isListening) {
      // Auto-stopped — send if we got something
      stopMic();
      const text = userInput.value.trim();
      if (text) {
        setTimeout(() => handleSend(), 300);
      } else {
        userInput.placeholder = 'Type or tap 🎤 to speak...';
      }
    }
  };

  return r;
}

function toggleMic() {
  if (!SpeechRecognition) {
    addBubble("Speech recognition isn't supported in this browser. Try Chrome or Safari on your phone.", 'ai');
    return;
  }
  if (isListening) {
    stopMic();
  } else {
    startMic();
  }
}

function startMic() {
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  try {
    recognition.start();
    // Show hint bar
    const hint = document.getElementById('inputHint');
    if (hint) hint.style.display = 'block';
  } catch(e) {
    recognition = initRecognition();
  }
}

function stopMic() {
  isListening = false;
  const btn = document.getElementById('micBtn');
  if (btn) btn.classList.remove('listening');
  if (recognition) { try { recognition.stop(); } catch(e){} }
  userInput.placeholder = 'Type or tap 🎤 to speak...';
}

// ── VOICE TTS ──────────────────────────────────────────────────────────────
let voiceEnabled = false;
const synth = window.speechSynthesis;
let selectedVoice = null;

// Female voice priority list — works across iOS, Android, and desktop
const FEMALE_VOICE_NAMES = [
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Michelle Online (Natural) - English (United States)',
  'Microsoft Emma Online (Natural) - English (United States)',
  'Microsoft Ana Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Sonia Online (Natural) - English (United Kingdom)',
  'Microsoft Libby Online (Natural) - English (United Kingdom)',
  'Microsoft Zira - English (United States)',
  'Samantha',
  'Google US English Female',
  'Microsoft Zira',
];

function loadFemaleVoice() {
  const voices = synth.getVoices();
  if (!voices.length) return;

  console.log('Available voices:', voices.map(v => v.name + (v.default ? ' [DEFAULT]' : '')).join(', '));

  // Match by exact name from priority list — skip system default since it may be male
  for (const name of FEMALE_VOICE_NAMES) {
    const match = voices.find(v => v.name === name);
    if (match) { selectedVoice = match; console.log('✅ Voice selected:', match.name); return; }
  }

  // Fallback: any voice with 'female' in the name
  const femaleFallback = voices.find(v => v.name.toLowerCase().includes('female'));
  if (femaleFallback) { selectedVoice = femaleFallback; console.log('✅ Female fallback:', femaleFallback.name); return; }

  // Last resort: first English voice
  const englishFallback = voices.find(v => v.lang && v.lang.startsWith('en'));
  if (englishFallback) { selectedVoice = englishFallback; console.log('⚠️ English fallback:', englishFallback.name); return; }

  console.log('❌ No voice found.');
}

// Voices load asynchronously on most browsers
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = loadFemaleVoice;
}
// Also try immediately in case voices are already loaded
loadFemaleVoice();

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  // Always reload voices fresh on toggle
  loadFemaleVoice();
  // Sync main start-screen button
  const btn = document.getElementById('voiceToggle');
  if(btn){
    btn.textContent = voiceEnabled ? '🔊 Voice On — Questions Will Be Read Aloud' : '🔇 Voice Off — Tap to Hear Questions Read Aloud';
    btn.classList.toggle('on', voiceEnabled);
  }
  // Sync floating button
  const floatBtn = document.getElementById('voiceFloat');
  if(floatBtn){
    floatBtn.textContent = voiceEnabled ? '🔊' : '🔇';
    floatBtn.classList.toggle('on', voiceEnabled);
  }
  if (voiceEnabled && !selectedVoice) loadFemaleVoice();
}

function showVoiceFloat() {
  const floatBtn = document.getElementById('voiceFloat');
  if(floatBtn) floatBtn.style.display = 'block';
}

function speak(text) {
  if (!voiceEnabled || !synth) return;
  synth.cancel();
  const plain = text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g,' ');
  const utt = new SpeechSynthesisUtterance(plain);
  utt.rate = 0.92;
  utt.pitch = 1.05;
  utt.volume = 1;
  if (selectedVoice) {
    utt.voice = selectedVoice;
    console.log('🔊 Speaking with:', selectedVoice.name);
  } else {
    console.log('⚠️ No voice selected — using browser default');
  }
  synth.speak(utt);
}

// ── DOM ────────────────────────────────────────────────────────────────────
const chatWindow = document.getElementById('chatWindow');
const userInput  = document.getElementById('userInput');
const inputArea  = document.getElementById('inputArea');
const sendBtn    = document.getElementById('sendBtn');

function updateProgress(){
  if(!activeFlow || activeFlow.length === 0) return;
  const pct = Math.round((flowIndex / activeFlow.length) * 100);
  const fill = document.getElementById('progressFill');
  const pctEl = document.getElementById('progressPct');
  const wrap = document.getElementById('progressWrap');
  if(fill) fill.style.width = Math.min(pct, 100) + '%';
  if(pctEl) pctEl.textContent = Math.min(pct, 100) + '%';
  if(wrap) wrap.style.display = 'flex';
}

function scrollBottom(){setTimeout(()=>chatWindow.scrollTop=chatWindow.scrollHeight,80);}

function addBubble(text, role){
  const row=document.createElement('div'); row.className=`bubble-row ${role}`;
  const av=document.createElement('div'); av.className=`avatar ${role}`;
  av.textContent=role==='ai'?'AI':'YOU';
  const bub=document.createElement('div'); bub.className=`bubble ${role}`;
  bub.innerHTML=text.replace(/\n/g,'<br>');
  if(role==='user'){row.appendChild(bub);row.appendChild(av);}
  else{row.appendChild(av);row.appendChild(bub);}
  chatWindow.appendChild(row); scrollBottom();
  if(role==='ai') speak(text);
  return bub;
}

// ── AI CLEANUP ─────────────────────────────────────────────────────────────
async function cleanWithAI(rawText, context, fieldType){
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":ANTHROPIC_API_KEY,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:300,
        system: "You are a professional security report writer for S.A.F.E. Management. You ALWAYS rewrite input text into professional AP Style. You NEVER return the original text unchanged. You ALWAYS use third person — never she, he, they, her, his. Always refer to people as 'the female subject', 'the male subject', or 'the subject'. Return ONLY the rewritten text with no preamble.",
        messages:[{role:"user",content:
          fieldType === 'description'
            ? 'Rewrite in professional AP Style past tense third person. Replace: girl=female subject, guy=male subject, slap=strike, fight=physical altercation, went their own ways=departed the area separately. Keep all facts. Return only rewritten text.\n\nInput: ' + rawText
            : 'Rewrite in professional AP Style. If names are listed, format as "Witnesses included [names]". If clothing, use third person with hyphenated compound modifiers. Past tense. Keep all facts. Return only rewritten text.\n\nInput: ' + rawText
        }]
      })
    });
    const d=await r.json();
    console.log('cleanWithAI response:', JSON.stringify(d).slice(0,300));
    if(d.error){ console.error('API error:', d.error.message); return rawText; }
    if(d.type === 'error'){ console.error('API error:', d); return rawText; }
    const result = d.content&&d.content[0]&&d.content[0].text ? d.content[0].text.trim() : null;
    if(!result){ console.error('No content in response'); return rawText; }
    return result;
  }catch(e){console.error('cleanWithAI error:',e); return rawText;}
}

// ── EMAIL VIA MAILTO ───────────────────────────────────────────────────────
function sendViaMailto(isIncident){
  const fd=formData;
  const hrEmail='safeeventmi@safemanagement.net';
  const supEmail=fd.supervisorEmail||'';
  const title=isIncident?'S.A.F.E. Incident Report':'S.A.F.E. Employee Recognition';
  const supName=`${fd.supervisorFirstName||''} ${fd.supervisorLastName||''}`.trim();

  let body = `${title}\n`;
  body += `================================\n`;
  body += `Incident Date: ${fd.incidentDate||fd.date}\nIncident Time: ${fd.incidentTime||fd.time}\n`;
  body += `Report Filed: ${fd.date} at ${fd.time} (Auto-Captured)\nVenue: ${fd.venue}\nReport Type: ${fd.formType}\n`;
  body += `Prepared By: ${supName}\nTitle: ${fd.supervisorTitle||'N/A'}\nSupervisor Email: ${supEmail}\n\n`;

  if(isIncident){
    body += `INCIDENT DETAILS\n----------------\n`;
    body += `Event: ${fd.eventName||'N/A'}\n`;
    body += `Category: ${fd.incidentCategory||'N/A'}\nSeverity: ${fd.incidentSeverity||'N/A'}\n`;
    body += `Location: ${fd.incidentLocation||'N/A'}\n`;
    body += `Environmental Conditions: ${fd.environmentalConditions||'N/A'}\n\n`;
    body += `CAMERA & COMMUNICATIONS\n-----------------------\n`;
    body += `Captured on Camera: ${fd.cameraCapture||'N/A'}\nCamera Zone: ${fd.cameraZone||'N/A'}\n`;
    body += `Safe Ops / Manager Contacted: ${fd.safeOpsContacted||'N/A'}\nContacted: ${fd.safeOpsWho||'N/A'}\n\n`;
    body += `GUEST INFORMATION\n-----------------\n`;
    body += `Name: ${fd.guestName||'Unknown'}\nSeat: ${fd.guestSeat||'Unknown'}\n`;
    body += `Gender: ${fd.guestGender||'Unknown'}\nAge Range: ${fd.guestAgeRange||'Unknown'}\n`;
    body += `Height: ${fd.guestHeight||'Unknown'}\nBuild: ${fd.guestBuild||'Unknown'}\n`;
    body += `Hair Color: ${fd.guestHair||'Unknown'}\n`;
    body += `Clothing: ${fd.guestClothing||'Unknown'}\nDistinguishing Features: ${fd.guestFeatures||'Unknown'}\n\n`;
    body += `INCIDENT NARRATIVE\n------------------\n${fd.incidentDescription||'N/A'}\n\n`;
    body += `Guest Statement: ${fd.guestStatement||'N/A'}\n`;
    body += `Guest Statement Detail: ${fd.guestStatementDetail||'N/A'}\n`;
    body += `Witnesses: ${fd.witnesses||'None'}\nAction Taken: ${fd.actionTaken||'N/A'}\n`;
    body += `EMS/Police: ${fd.emsPolice||'N/A'}\nGuest Transported: ${fd.guestTransported||'N/A'}\n\n`;
    body += `FOLLOW-UP\n---------\nRequired: ${fd.followUp||'N/A'}\nDetails: ${fd.followUpDetails||'N/A'}\n\n`;
  } else {
    const empName=`${fd.employeeFirstName||''} ${fd.employeeLastName||''}`.trim();
    body += `RECOGNITION DETAILS\n-------------------\n`;
    body += `Employee: ${empName}\nRole: ${fd.employeeRole||'N/A'}\n\n`;
    body += `Description:\n${fd.recognitionDescription||'N/A'}\n\n`;
    body += `Impact & S.A.F.E. Values:\n${fd.recognitionImpact||'N/A'}\n\n`;
  }
  body += `Additional Comments: ${fd.additionalComments||'None'}\n\n`;
  body += `---\nPhysical description provided for identification purposes only.\nThis report is confidential and intended solely for S.A.F.E. Management and Ford Field HR review.`;

  const to = supEmail ? `${hrEmail},${supEmail}` : hrEmail;
  const subject=encodeURIComponent(`[S.A.F.E.] ${title} — ${fd.date}`);
  const encodedBody=encodeURIComponent(body);
  window.location.href=`mailto:${to}?subject=${subject}&body=${encodedBody}`;
}

  const isFordField = venue && venue.includes('Ford Field');

  // Search box

  const hint = document.createElement('div');
  hint.className = 'event-search-hint';

  wrap.appendChild(hint);

  // Results container
  const resultsWrap = document.createElement('div');
  resultsWrap.className = 'event-search-results';
  wrap.appendChild(resultsWrap);

  // Other button
  const otherBtn = document.createElement('button');
  otherBtn.className = 'event-other-btn';
  otherBtn.textContent = '+ Event not listed — type it and tap confirm';
  wrap.appendChild(otherBtn);

  confirmBtn.style.cssText = 'margin-top:8px;display:none;';
  confirmBtn.textContent = '✓ Use this event name';
  wrap.appendChild(confirmBtn);

  function renderResults(query) {
    resultsWrap.innerHTML = '';
    const q = (query || '').toLowerCase().trim();
    const filtered = q
      ? allEvents.filter(({evt}) => evt.toLowerCase().includes(q))
      : allEvents;

    if (filtered.length === 0) {
      const none = document.createElement('div');
      none.className = 'event-no-results';
      none.textContent = 'No matches — try different keywords';
      resultsWrap.appendChild(none);
      return;

      if (cat !== lastCat) {
        const catEl = document.createElement('div');
        catEl.className = 'event-result-cat';
        catEl.textContent = cat;
        resultsWrap.appendChild(catEl);
        lastCat = cat;

      item.textContent = evt;
      item.onclick = () => {
        wrap.remove();
        onSelect(evt);
      };
      resultsWrap.appendChild(item);
    });

  // Wire up input — fire on every keystroke
  input.addEventListener('input', function() {
    renderResults(this.value);
  });

  input.addEventListener('keyup', function() {
    renderResults(this.value);
  });

  input.onfocus = function() {
    renderResults(this.value);
  };

  input.onkeydown = function(e) {
    e.stopPropagation();

    input.value = '';
    input.placeholder = 'Type the event name here...';
    confirmBtn.style.display = 'block';
    input.focus();
  };

  inputArea.style.display = 'none';
  document.getElementById('inputHint').style.display = 'none';

  // Show all events initially
  renderResults('');

  chatWindow.appendChild(wrap);
  scrollBottom();

}

function showPhotoUpload(onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'photo-upload-wrap';

  const title = document.createElement('h4');
  title.textContent = 'Attach Photos (Optional)';
  wrap.appendChild(title);

  const dropZone = document.createElement('div');
  dropZone.className = 'photo-drop-zone';
  dropZone.innerHTML = '<div class="icon">📷</div><p>Tap to select photos<br><small>Up to 5 photos · 5MB total</small></p>';

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.multiple = true;
  fileInput.style.cssText = 'position:absolute;width:100%;height:100%;top:0;left:0;opacity:0;cursor:pointer;';

  dropZone.style.position = 'relative';
  dropZone.appendChild(fileInput);
  wrap.appendChild(dropZone);

  const previews = document.createElement('div');
  previews.className = 'photo-previews';
  wrap.appendChild(previews);

  const countEl = document.createElement('div');
  countEl.className = 'photo-count';
  wrap.appendChild(countEl);

  function updatePreviews() {
    previews.innerHTML = '';
    uploadedPhotos.forEach((p, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      const img = document.createElement('img');
      img.src = p.dataUrl;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-photo';
      removeBtn.textContent = '×';
      removeBtn.onclick = (e) => { e.stopPropagation(); uploadedPhotos.splice(i,1); updatePreviews(); };
      thumb.appendChild(img);
      thumb.appendChild(removeBtn);
      previews.appendChild(thumb);
    });
    countEl.textContent = uploadedPhotos.length > 0 ? `${uploadedPhotos.length} photo${uploadedPhotos.length>1?'s':''} attached` : '';
  }

  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files);
    let totalSize = uploadedPhotos.reduce((s,p) => s + p.size, 0);
    for (const file of files) {
      if (uploadedPhotos.length >= 5) { alert('Maximum 5 photos allowed.'); break; }
      if (totalSize + file.size > 5 * 1024 * 1024) { alert('Total photo size cannot exceed 5MB.'); break; }
      const dataUrl = await new Promise(res => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.readAsDataURL(file);
      });
      uploadedPhotos.push({ name: file.name, dataUrl, size: file.size });
      totalSize += file.size;
    }
    updatePreviews();
    scrollBottom();
  };

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'cal-confirm-btn';
  confirmBtn.style.marginTop = '10px';
  confirmBtn.textContent = uploadedPhotos.length > 0 ? '✓ Attach & Continue' : '✓ Continue';
  confirmBtn.onclick = () => {
    wrap.remove();
    onComplete(uploadedPhotos.length > 0 ? `${uploadedPhotos.length} photo(s) attached` : 'No photos attached');
  };
  wrap.appendChild(confirmBtn);

  const skipBtn = document.createElement('button');
  skipBtn.className = 'photo-skip-btn';
  skipBtn.textContent = 'Skip — No photos to attach';
  skipBtn.onclick = () => { uploadedPhotos = []; wrap.remove(); onComplete('No photos attached'); };
  wrap.appendChild(skipBtn);

  chatWindow.appendChild(wrap);
  scrollBottom();
}

// ── SIGNATURE PAD ──────────────────────────────────────────────────────────
function showSignaturePad(onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'sig-pad-wrap';

  const title = document.createElement('h4');
  title.textContent = 'Supervisor Signature';
  wrap.appendChild(title);

  const hint = document.createElement('div');
  hint.className = 'sig-pad-hint';
  hint.textContent = 'Sign with your finger or mouse below to certify this report.';
  wrap.appendChild(hint);

  const canvas = document.createElement('canvas');
  canvas.id = 'sigCanvas';
  canvas.width = 600;
  canvas.height = 140;
  canvas.style.touchAction = 'none';
  wrap.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1A2E4A';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let drawing = false;
  let hasSig = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
  }

  canvas.addEventListener('mousedown', e => { drawing = true; hasSig = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('mousemove', e => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; hasSig = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }, {passive:false});
  canvas.addEventListener('touchend', () => drawing = false);

  const actions = document.createElement('div');
  actions.className = 'sig-pad-actions';

  const clearBtn = document.createElement('button');
  clearBtn.className = 'sig-clear-btn';
  clearBtn.textContent = '✕ Clear';
  clearBtn.onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasSig = false; };
  actions.appendChild(clearBtn);

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'sig-confirm-btn';
  confirmBtn.textContent = '✓ Sign & Complete';
  confirmBtn.onclick = () => {
    if (!hasSig) { alert('Please sign before continuing.'); return; }
    const sigDataUrl = canvas.toDataURL('image/png');
    wrap.remove();
    onComplete(sigDataUrl);
  };
  actions.appendChild(confirmBtn);
  wrap.appendChild(actions);

  chatWindow.appendChild(wrap);
  scrollBottom();
}

async function processAnswer(raw){
  inputArea.style.display='none';
  document.getElementById('inputHint').style.display='none';
  stopMic();
  awaitingInput=false;
  const step=activeFlow[flowIndex]; const key=step.key;
  const skipWords=['skip',"don't know","i don't know",'unknown','not sure','n/a'];
  const isSkip=skipWords.some(w=>raw.toLowerCase().includes(w));

  // venue routing
  if(key==='venue'){
    formData.venue='Ford Field, Detroit, Michigan'; // confirmed by officer
    // Update timestamp bar
    document.getElementById('timestampBar').textContent = `📍 ${formData.venue.split(',')[0]}  ·  ${formData.date}  ·  ${formData.time}  ·  Auto-captured`;
    flowIndex++; await askNextQuestion(); return;
  }

  // formType routing
  if(key==='formType'){
    formData[key]=raw;
    incidentType=raw.includes('Incident')?'incident':'recognition';
    activeFlow=incidentType==='incident'?incidentFlow:recognitionFlow;
    flowIndex=0; await askNextQuestion(); return;
  }

  // Email field with remember option
  if(step.isEmail){
    formData[key]=raw;
    if(raw.includes('@')){
      // Save email to localStorage immediately
      localStorage.setItem('safe_supervisor_email', raw);
      const remRow=document.createElement('div'); remRow.className='remember-row';
      remRow.innerHTML=`<input type="checkbox" id="rememberEmail" checked> <label for="rememberEmail">Remember my email for next time</label>`;
      chatWindow.appendChild(remRow); scrollBottom();
      await delay(200);
      const cb=document.getElementById('rememberEmail');
      setTimeout(()=>{
        if(!cb.checked) localStorage.removeItem('safe_supervisor_email');
        flowIndex++; askNextQuestion();
      },1500);
      cb.addEventListener('change',()=>{
        if(cb.checked) localStorage.setItem('safe_supervisor_email',raw);
        else localStorage.removeItem('safe_supervisor_email');
      });
    } else {
      formData[key]='Not provided'; flowIndex++; await askNextQuestion();
    }
    return;
  }

  // actionTaken Other — reveal text input
  if(key==='actionTaken' && raw==='Other — specify'){
    showTyping(); await delay(400); removeTyping();
    addBubble('Please describe the action taken:','ai');
    inputArea.style.display='flex'; awaitingInput=true;
        sendInterceptor=async(val)=>{
      inputArea.style.display='none'; awaitingInput=false;
      const ctx=`Incident report action taken field for ${formData.venue}.`;
      const cleaned=await cleanWithAI(val,ctx,'field');
      addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this look right?`,'ai');
      addQuickReplies(['Yes, that looks right','✏️ Edit','No, let me re-describe'],async(confirm)=>{
        clearQuickReplies(); addBubble(confirm,'user');
        if(confirm.startsWith('Yes')){formData.actionTaken=cleaned;flowIndex++;await askNextQuestion();}
        else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{addBubble(e,'user');formData.actionTaken=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
        else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
      });
    };
    return;
  }

  // guestSeat typed
  if(key==='guestSeat'){
    formData[key]=isSkip?'Unknown':raw;
    flowIndex++; await askNextQuestion(); return;
  }

  // witnesses typed
  if(key==='witnesses'){
    if(isSkip){ formData[key]='None'; flowIndex++; await askNextQuestion(); return; }
    const ctx=`Incident report witness field for ${formData.venue}.`;
    const cleaned=await cleanWithAI(raw,ctx,'field');
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this look right?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{addBubble(e,'user');formData[key]=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
      else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  // emsPolice typed
  if(key==='emsPolice'){
    if(isSkip||raw.toLowerCase().includes('not applicable')){formData[key]='Not applicable';flowIndex++;await askNextQuestion();return;}
    const ctx=`Incident report EMS/police involvement field for ${formData.venue}.`;
    const cleaned=await cleanWithAI(raw,ctx,'field');
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this look right?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{addBubble(e,'user');formData[key]=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
      else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  // additionalComments typed
  if(key==='additionalComments'){
    if(isSkip){ formData[key]='None'; flowIndex++; await askNextQuestion(); return; }
    const ctx=`Incident report additional comments field for ${formData.venue}.`;
    const cleaned=await cleanWithAI(raw,ctx,'field');
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this look right?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){userInput.value=cleaned;inputArea.style.display='flex';awaitingInput=true;sendInterceptor=async(e)=>{addBubble(e,'user');formData[key]=e;inputArea.style.display='none';awaitingInput=false;flowIndex++;await askNextQuestion();};}
      else{addBubble("No problem — describe it again.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  // Guest name special handling
  if(key==='guestName'){
    const firstName = raw;
    showTyping(); await delay(400); removeTyping();
    addBubble("And the guest's last name? If you don't have it or the guest refused, tap below.","ai");

    const finishName = async(lastName) => {
      sendInterceptor = null;
      formData.guestName = lastName ? `${firstName} ${lastName}`.trim() : firstName;
      flowIndex++; await askNextQuestion();
    };

    showInlineOptions(['Unknown / Guest Refused'], async()=>{
      inputArea.style.display='none'; awaitingInput=false;
      sendInterceptor = null;
      addBubble('Unknown / Guest Refused','user');
      await finishName('');
    });

    inputArea.style.display='flex'; awaitingInput=true;
    document.getElementById('inputHint').style.display='block';
    userInput.focus();

    sendInterceptor = async(ln) => {
      inputArea.style.display='none'; awaitingInput=false;
      await finishName(ln);
    };
    return;
  }

  // Pre-defined tap selections — skip AI cleanup entirely
  const preDefinedValues = [
    'Refused to Speak','Uncooperative','None','Not applicable',
    '✅ Confirmed — Ford Field, Detroit',
    'No Action Taken','No — not captured','No — not contacted',
    'No — incident resolved','Yes — follow-up needed',
    'Verbal Warning','Written Warning','Ejection from Venue',
    'Referred to Guest Services','Suspension','Termination',
    'EMS Called','Detroit PD Called',
    'Minor — Resolved on scene','Moderate — Required additional response',
    'Serious — EMS / Police / Management involved',
    'Yes — captured on surveillance','Safe Ops was monitoring',
    'Unknown / Not confirmed','Yes — contacted Safe Ops',
    'Yes — contacted my manager','Both contacted',
    'Male','Female','Non-binary','Unknown / Not Observed',
    'Slim / Thin','Medium / Average','Heavyset / Large','Athletic / Muscular',
    'Yes — transported by EMS','Yes — left on their own',
    'No — remained on site','Not applicable',
    'No photos attached','1 photo(s) attached','2 photo(s) attached','3 photo(s) attached',
    'Hat or cap','None observed','Incident Report','Employee Recognition',
    'Guest Altercation','Slip / Fall / Medical','Intoxication / Ejection',
    'Employee Misconduct','Unauthorized Access','Theft / Property Damage',
    'Lost Person / Child','Other','Just now','Earlier today','Yesterday',
  ];
  const rawLower = raw.toLowerCase().trim();
  const isPreDefined = preDefinedValues.some(v => v.toLowerCase() === rawLower) ||
    rawLower === 'refuse to speak' || rawLower === 'none' || rawLower === 'n/a' ||
    raw.startsWith('📍') || raw.startsWith('✅') || raw.startsWith('📅');
  if(isPreDefined){
    if(rawLower.includes('refuse') || rawLower.includes('refused')) formData[key] = 'Refused to Speak';
    else formData[key] = raw;
    flowIndex++; await askNextQuestion();
    return;
  }

  // Long text AI cleanup
  const longFields=['incidentDescription','guestStatement','guestClothing','guestFeatures','guestStatementDetail','witnesses','actionTaken','emsPolice','additionalComments','followUpDetails','cameraZone','safeOpsWho','environmentalConditions','recognitionDescription','recognitionImpact','employeeRole'];
  if(longFields.includes(key)&&raw.length>5&&!isSkip){
    console.log('🔄 cleanWithAI triggered for key:', key, 'raw length:', raw.length);
    showTyping(); await delay(300);
    addBubble("Writing that up in professional language...","ai");
    const ctx=`This is a ${incidentType==='incident'?formData.incidentCategory+' incident':'employee recognition'} report for ${formData.venue}.`;
    const fieldType = ['incidentDescription','guestStatement','guestStatementDetail','recognitionDescription','recognitionImpact'].includes(key) ? 'description' : 'field';
    const cleaned=await cleanWithAI(raw,ctx,fieldType);
    removeTyping(); showTyping(); await delay(500); removeTyping();
    addBubble(`Here's how it will read on the report:<br><br><em>"${cleaned}"</em><br><br>Does this accurately capture what happened?`,'ai');
    addQuickReplies(['Yes, that looks right','✏️ Edit — change a word or two','No, let me re-describe'],async(confirm)=>{
      clearQuickReplies(); addBubble(confirm,'user');
      if(confirm.startsWith('Yes')){formData[key]=cleaned;flowIndex++;await askNextQuestion();}
      else if(confirm.startsWith('✏️')){
        showTyping(); await delay(400); removeTyping();
        addBubble('Here is the text — edit it directly, then tap send:','ai');
        userInput.value=cleaned;
        userInput.style.height='auto';
        userInput.style.height=Math.min(userInput.scrollHeight,110)+'px';
        inputArea.style.display='flex'; awaitingInput=true;
        sendInterceptor=async(_intercepted)=>{
          const edited=_intercepted.trim();
          if(!edited){ flowIndex++; await askNextQuestion(); return; }
          addBubble(edited,'user');
          formData[key]=edited; inputArea.style.display='none'; awaitingInput=false;
          sendInterceptor=null;
          flowIndex++; await askNextQuestion();
        };
      }
      else{addBubble("No problem — describe it again and I'll rewrite it.",'ai');inputArea.style.display='flex';awaitingInput=true;}
    });
    return;
  }

  formData[key]=isSkip?'Unknown / Not Available':raw;
  flowIndex++; await askNextQuestion();

async function showFinalForm(){
  showTyping(); await delay(900); removeTyping();
  const isIncident=incidentType==='incident';
  const supName=`${formData.supervisorFirstName||''} ${formData.supervisorLastName||''}`.trim();
  formData.supervisorName=supName;
  const empName=`${formData.employeeFirstName||''} ${formData.employeeLastName||''}`.trim();
  formData.employeeName=empName;

  // Generate professional narrative for incidents
  if(isIncident && !formData.professionalNarrative){
    addBubble("Generating your professional incident narrative...",'ai');
    showTyping();
    const narrativePrompt = `You are a professional security documentation specialist for S.A.F.E. Management at Ford Field, Detroit.

Using ONLY the information provided below, write a single cohesive professional incident narrative in AP Style. Third person, past tense. Do not add any facts not listed. Do not use bullet points. Write 2-3 paragraphs maximum. Make it read as a court-ready security report.

Incident Date: ${formData.incidentDate||formData.date}
Incident Time: ${formData.incidentTime||formData.time}
Venue: ${formData.venue}
Event: ${formData.eventName||'N/A'}
Location: ${formData.incidentLocation||'N/A'}
Incident Type: ${formData.incidentCategory||'N/A'}
Severity: ${formData.incidentSeverity||'N/A'}
Reporting Officer: ${supName}, ${formData.supervisorTitle||''}
Guest Name: ${formData.guestName||'Unknown'}

Incident Description: ${formData.incidentDescription||'N/A'}
Guest Statement: ${formData.guestStatement||'N/A'}
Witnesses: ${formData.witnesses||'None'}
Action Taken: ${formData.actionTaken||'N/A'}
EMS/Police: ${formData.emsPolice||'N/A'}

Safe Ops Contacted: ${formData.safeOpsContacted||'N/A'} — ${formData.safeOpsWho||''}
Follow-Up: ${formData.followUp||'N/A'} — ${formData.followUpDetails||''}
Additional Comments: ${formData.additionalComments||'None'}

Return ONLY the narrative text. No preamble, no labels, no markdown.`;

    try {
      const r = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:narrativePrompt}]})
      });
      const d = await r.json();
      formData.professionalNarrative = d.content&&d.content[0] ? d.content[0].text.trim() : '';
    } catch(e){ formData.professionalNarrative = formData.incidentDescription||''; }

  }

  addBubble("Your report is ready. Please review everything carefully before signing. You can edit any of your responses below.",'ai');

  // Show narrative block
  if(isIncident && formData.professionalNarrative){
    const nb = document.createElement('div');
    nb.className = 'bubble-row ai';
    const av = document.createElement('div'); av.className='avatar ai'; av.textContent='AI';
    const bub = document.createElement('div'); bub.className='bubble ai';
    bub.innerHTML = `<strong>Professional Narrative:</strong><div class="narrative-block">${formData.professionalNarrative.replace(/\n/g,'<br>')}</div>`;
    nb.appendChild(av); nb.appendChild(bub);
    chatWindow.appendChild(nb);
    scrollBottom();
  }

  const card=document.createElement('div'); card.className='form-preview';
  card.innerHTML=buildFormHTML(isIncident,supName,empName);
  chatWindow.appendChild(card);

  // Action buttons — edit, save, download, and Ready to Sign
  const editBtn = card.querySelector('.edit-report-btn');
  const saveBtn = card.querySelector('.save-edits-btn');
  const pdfBtn = card.querySelector('.download-pdf-btn');
  const wordBtn = card.querySelector('.download-word-btn');
  const statusDiv = card.querySelector('.email-status');

  // Ready to Sign button — appears below report, before signature pad
  const signReadyBtn = document.createElement('button');
  signReadyBtn.style.cssText = 'width:100%;margin-top:12px;padding:16px;background:var(--safe-navy);color:#fff;border:none;border-radius:12px;font-family:Inter,sans-serif;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.3px;';
  signReadyBtn.textContent = '✍️ I\'ve Reviewed — Ready to Sign';
  card.appendChild(signReadyBtn);

  let editMode = false;
  editBtn.onclick = () => {
    editMode = true;
    editBtn.style.display='none';
    saveBtn.style.display='block';
    signReadyBtn.style.display='none';
    card.querySelectorAll('.editable-value').forEach(el => {
      el.style.display='none';
      el.nextElementSibling.style.display='block';
    });
  };
  saveBtn.onclick = () => {
    editMode = false;
    card.querySelectorAll('.editable-input').forEach(inp => {
      const key = inp.dataset.key;
      if(key) formData[key] = inp.value;
      inp.style.display='none';
      inp.previousElementSibling.textContent = inp.value;
      inp.previousElementSibling.style.display='block';
    });
    saveBtn.style.display='none';
    editBtn.style.display='block';
    signReadyBtn.style.display='block';
    scrollBottom();
  };

  pdfBtn.onclick=()=>generatePDF(isIncident);
  wordBtn.onclick=()=>generateWord(isIncident);

  // Ready to Sign — shows signature pad, locks report
  signReadyBtn.onclick = async () => {
    signReadyBtn.disabled = true;
    signReadyBtn.textContent = '⏳ Opening signature pad...';
    editBtn.style.display='none';
    saveBtn.style.display='none';
    // Scroll to bottom so signature pad is visible
    scrollBottom();
    await delay(500);
    showSignaturePad(async(sigDataUrl)=>{
      formData.supervisorSignature = sigDataUrl;
      signReadyBtn.remove();
      // Show signature on card
      const sigRow = document.createElement('div');
      sigRow.style.cssText='padding:10px 18px;border-top:1px solid var(--border);margin-top:8px;';
      sigRow.innerHTML=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px;">Supervisor Signature</div><img src="${sigDataUrl}" style="max-width:200px;border:1px solid var(--border);border-radius:6px;display:block;"/><div style="font-size:13px;font-weight:700;color:var(--text-main);margin-top:6px;border-top:1.5px solid var(--border);padding-top:4px;">${supName}</div><div style="font-size:11px;color:var(--text-muted);">${formData.supervisorTitle||''}</div>`;
      card.appendChild(sigRow);
      // Show submit buttons — report is now locked
      const submitWrap = document.createElement('div');
      submitWrap.style.cssText='padding:0 0 8px;';
      submitWrap.innerHTML=`
        <div style="font-size:12px;color:var(--text-muted);text-align:center;margin:12px 0 8px;font-style:italic;">Report signed and locked. Download or submit below.</div>
        <button class="download-pdf-btn" style="margin-top:6px;">⬇ Download Professional PDF</button>
        <button class="download-word-btn" style="margin-top:6px;">⬇ Download Word Document</button>
        <button class="submit-btn" style="margin-top:6px;">📧 Submit Report — Send to HR & Myself</button>
        <div class="email-status"></div>
      `;
      card.appendChild(submitWrap);
      submitWrap.querySelector('.download-pdf-btn').onclick=()=>generatePDF(isIncident);
      submitWrap.querySelector('.download-word-btn').onclick=()=>generateWord(isIncident);
      const finalSubmitBtn = submitWrap.querySelector('.submit-btn');
      const finalStatusDiv = submitWrap.querySelector('.email-status');
      finalSubmitBtn.onclick=async()=>{
        finalSubmitBtn.disabled=true;
        finalStatusDiv.className='email-status sending';
        finalStatusDiv.textContent='💾 Saving report to S.A.F.E. records...';
        const saved = await submitToSheets(isIncident);
        if(saved){ finalStatusDiv.textContent='✅ Saved. Opening email to notify HR...'; }
        else { finalStatusDiv.textContent='⚠️ Could not save — opening email anyway...'; }
        await delay(1200);
        sendViaMailto(isIncident);
        finalStatusDiv.className='email-status sent';
        finalStatusDiv.textContent='✅ Report saved and email opened — tap Send in your mail app to notify HR.';
      };
      scrollBottom();
      addBubble('✅ Report signed and locked. Download your copy or submit to HR below.','ai');
    });
  };

  scrollBottom();
}

function generatePDF(isIncident) {
  const fd = formData;
  const supName = `${fd.supervisorFirstName||''} ${fd.supervisorLastName||''}`.trim();
  const empName = `${fd.employeeFirstName||''} ${fd.employeeLastName||''}`.trim();
  const title = isIncident ? 'Incident Report' : 'Employee Recognition Report';
  const submissionId = 'SAFE-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(Math.random()*9000+1000);

  const css = `
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* LETTERHEAD */
    .letterhead { background: #134D7F; padding: 20px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 5px solid #D82E44; }
    .lh-left { display: flex; flex-direction: column; }
    .lh-logo { font-family: Georgia, serif; font-size: 32px; color: #D82E44; font-weight: 700; letter-spacing: 4px; line-height: 1; }
    .lh-mgmt { font-size: 11px; font-weight: 700; color: #C8CDD4; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
    .lh-right { text-align: right; }
    .lh-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
    .lh-sub { font-size: 10px; color: #C8CDD4; margin-top: 3px; letter-spacing: 0.5px; }
    .lh-season { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
    .lh-year { font-size: 16px; font-weight: 700; color: #D82E44; letter-spacing: 2px; }
    .lh-motto { font-size: 8px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }

    /* ID BAR */
    .id-bar { background: #D82E44; color: #fff; padding: 6px 30px; font-size: 11px; font-weight: 500; display: flex; justify-content: space-between; }

    /* BODY */
    .body { padding: 24px 30px; }

    /* SECTION */
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #D82E44; border-bottom: 2px solid #D82E44; padding-bottom: 4px; margin: 20px 0 10px; }
    .section-title:first-child { margin-top: 0; }

    /* FIELDS */
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 4px; }
    .field-grid.single { grid-template-columns: 1fr; }
    .field { margin-bottom: 6px; }
    .field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #475569; margin-bottom: 2px; }
    .field-value { font-size: 13px; color: #1e1e1e; padding: 6px 10px; background: #f4f4f4; border-left: 3px solid #134D7F; line-height: 1.5; }
    .field-value.unknown { color: #94a3b8; font-style: italic; }
    .field-value.narrative { background: #f4f4f4; border-left: 3px solid #134D7F; padding: 10px 12px; line-height: 1.7; }

    /* SEVERITY BADGES */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .badge.minor { background: #d1fae5; color: #065f46; }
    .badge.moderate { background: #fef9c3; color: #854d0e; }
    .badge.serious { background: #fee2e2; color: #991b1b; }

    /* SIGNATURE BLOCK */
    .sig-section { margin-top: 30px; border-top: 2px solid #134D7F; padding-top: 20px; }
    .sig-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 16px; }
    .sig-box { border-top: 1.5px solid #1e1e1e; padding-top: 8px; }

    @media print {
      body { padding: 0; }
      .page { max-width: 100%; }
      @page { margin: 0; }
    }
  `;

  function fv(label, value, full) {
    const val = value || 'Unknown / Not Available';
    const cls = (!value || value === 'Unknown / Not Available') ? 'unknown' : '';
    return `<div class="field${full?' full':''}"><div class="field-label">${label}</div><div class="field-value ${cls}">${val}</div></div>`;
  }

  function severityBadge(sev) {
    if (!sev) return 'Unknown / Not Available';
    if (sev.includes('Minor')) return `<span class="badge minor">${sev}</span>`;
    if (sev.includes('Moderate')) return `<span class="badge moderate">${sev}</span>`;
    if (sev.includes('Serious')) return `<span class="badge serious">${sev}</span>`;
    return sev;

  let body = '';

  // Report Information

  body += `</div>`;

  if (isIncident) {
    // Incident Details
    body += `<div class="section-title">Incident Details</div>`;
    body += `<div class="field-grid">`;
    body += fv('Event', fd.eventName);
    body += fv('Incident Category', fd.incidentCategory);
    body += `<div class="field"><div class="field-label">Severity</div><div class="field-value">${severityBadge(fd.incidentSeverity)}</div></div>`;
    body += fv('Incident Location', fd.incidentLocation);
    body += fv('Environmental Conditions', fd.environmentalConditions);
    body += `</div>`;

    // Camera & Communications
    body += `<div class="section-title">Camera & Communications</div>`;
    body += `<div class="field-grid">`;
    body += fv('Captured on Surveillance Camera', fd.cameraCapture);
    body += fv('Camera Zone / Area', fd.cameraZone);
    body += fv('Safe Ops / Manager Contacted', fd.safeOpsContacted);
    body += fv('Who Was Contacted', fd.safeOpsWho);
    body += `</div>`;

    // Guest Information
    body += `<div class="section-title">Guest Information</div>`;
    body += `<div class="field-grid">`;
    body += fv('Guest Name', fd.guestName);
    body += fv('Seat Location (Section / Row / Seat)', fd.guestSeat);
    body += fv('Gender', fd.guestGender);
    body += fv('Age Range', fd.guestAgeRange);
    body += fv('Height', fd.guestHeight);
    body += fv('Build', fd.guestBuild);
    body += fv('Hair Color', fd.guestHair);
    body += fv('Hair Style', fd.guestHairStyle);
    body += fv('Clothing', fd.guestClothing);
    body += fv('Distinguishing Features', fd.guestFeatures);
    body += fv('Guest Photos', fd.guestPhotos||'None');
    body += fv('Scene / Evidence Photos', fd.scenePhotos||'None');
    body += `</div>`;

    // Incident Narrative
    body += `<div class="section-title">Incident Narrative</div>`;
    if(fd.professionalNarrative){
      body += `<div class="field"><div class="field-label">Professional Narrative</div><div class="field-value narrative">${fd.professionalNarrative}</div></div>`;
    }
    body += `<div class="field"><div class="field-label">Officer's Description</div><div class="field-value narrative">${fd.incidentDescription || 'Not provided'}</div></div>`;
    body += `<div class="field-grid" style="margin-top:10px;">`;
    body += fv('Guest Account of Incident', fd.guestStatement);
    body += fv('Guest Statement Detail', fd.guestStatementDetail);
    body += fv('Witnesses', fd.witnesses);
    body += fv('Action Taken', fd.actionTaken);
    body += fv('EMS / Police Involvement', fd.emsPolice);
    body += fv('Guest Transported', fd.guestTransported);
    body += `</div>`;

    // Follow-Up
    body += `<div class="section-title">Follow-Up</div>`;
    body += `<div class="field-grid">`;
    body += fv('Follow-Up Required', fd.followUp);
    body += fv('Follow-Up Details', fd.followUpDetails);
    body += `</div>`;

  } else {
    // Recognition
    body += `<div class="section-title">Recognition Details</div>`;
    body += `<div class="field-grid">`;
    body += fv('Employee Name', empName);
    body += fv('Employee Role', fd.employeeRole);
    body += `</div>`;
    body += `<div class="field"><div class="field-label">Description of Good Deed</div><div class="field-value narrative">${fd.recognitionDescription || 'Not provided'}</div></div>`;
    body += `<div class="field" style="margin-top:10px;"><div class="field-label">Impact & S.A.F.E. Values</div><div class="field-value narrative">${fd.recognitionImpact || 'Not provided'}</div></div>`;
  }

  // Additional Comments
  body += `<div class="section-title">Additional Comments</div>`;
  body += `<div class="field"><div class="field-value">${fd.additionalComments || 'None'}</div></div>`;

  // Signature Block
  body += `
    <div class="sig-section">
      <div class="section-title" style="border:none;margin-top:0;">Signatures</div>
      <div class="sig-grid">
        <div class="sig-box">
          <div class="sig-space">${fd.supervisorSignature?`<img src="${fd.supervisorSignature}" style="max-height:38px;max-width:160px;"/>`:''}</div>

          <div class="sig-space"></div>
          <div class="sig-label">HR Received By</div>
          <div class="sig-name">&nbsp;</div>
        </div>

    </div>`;

  body += `<div class="disclaimer">Physical description provided for identification purposes only. This report is strictly confidential and intended solely for S.A.F.E. Management and authorized HR personnel. Unauthorized disclosure is prohibited.</div>`;

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S.A.F.E. ${title} — ${submissionId}</title>
<style>${css}</style>
</head>
<body>
<div class="page">
  <div class="letterhead">
    <div class="lh-left">
      <div class="lh-logo">S.A.F.E.</div>
      <div class="lh-mgmt">Management</div>
    </div>
    <div class="lh-right">
      <div class="lh-title">${title}</div>
      <div class="lh-sub">Security · Athletic Facilities · Events · Ford Field, Detroit</div>
      <div class="lh-season">
        <div class="lh-year">2026</div>
        <div class="lh-motto">Stronger Together</div>
      </div>
    </div>
  </div>
  <div class="id-bar">
    <span>Submission ID: ${submissionId}</span>
    <span>Filed: ${fd.date || ''} at ${fd.time || ''}</span>
  </div>
  <div class="body">${body}</div>
  <div class="footer">
    <div class="footer-text">S.A.F.E. Management · Confidential Document · 2026</div>
    <div class="footer-logo">S.A.F.E.</div>
  </div>
</div>
<scr"+"ipt>window.onload=()=>{window.print();}</scr"+"ipt>
</body>
</html>`;

  const win = window.open('', '_blank');
  if (win) {
    win.document.write(html);
    win.document.close();
  } else {
    alert('Please allow pop-ups for this site to download the PDF.');
  }
}

function generateWord(isIncident) {

  const submissionId = 'SAFE-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(Math.random()*9000+1000);

  let content = `S.A.F.E. MANAGEMENT — ${title.toUpperCase()}\n`;
  content += `${'='.repeat(50)}\n`;
  content += `Submission ID: ${submissionId}\n`;
  content += `Filed: ${fd.date} at ${fd.time}\n\n`;

  content += `REPORT INFORMATION\n${'-'.repeat(30)}\n`;

  content += `Prepared By: ${supName}\nTitle: ${fd.supervisorTitle||'N/A'}\nEmail: ${fd.supervisorEmail||'N/A'}\n\n`;

  if(isIncident){
    content += `INCIDENT DETAILS\n${'-'.repeat(30)}\n`;
    content += `Event: ${fd.eventName||'N/A'}\nCategory: ${fd.incidentCategory||'N/A'}\n`;
    content += `Severity: ${fd.incidentSeverity||'N/A'}\nLocation: ${fd.incidentLocation||'N/A'}\n`;
    content += `Environmental Conditions: ${fd.environmentalConditions||'N/A'}\n\n`;
    content += `CAMERA & COMMUNICATIONS\n${'-'.repeat(30)}\n`;
    content += `Surveillance Camera: ${fd.cameraCapture||'N/A'}\nCamera Zone: ${fd.cameraZone||'N/A'}\n`;
    content += `Safe Ops Contacted: ${fd.safeOpsContacted||'N/A'}\nContacted: ${fd.safeOpsWho||'N/A'}\n\n`;
    content += `GUEST INFORMATION\n${'-'.repeat(30)}\n`;
    content += `Name: ${fd.guestName||'Unknown'}\nSeat: ${fd.guestSeat||'Unknown'}\n`;
    content += `Gender: ${fd.guestGender||'N/A'}\nAge Range: ${fd.guestAgeRange||'N/A'}\n`;
    content += `Height: ${fd.guestHeight||'N/A'}\nBuild: ${fd.guestBuild||'N/A'}\n`;
    content += `Hair Color: ${fd.guestHair||'N/A'}\nHair Style: ${fd.guestHairStyle||'N/A'}\n`;
    content += `Clothing: ${fd.guestClothing||'N/A'}\nDistinguishing Features: ${fd.guestFeatures||'N/A'}\n`;
    content += `Guest Photos: ${fd.guestPhotos||'None'}\nScene Photos: ${fd.scenePhotos||'None'}\n\n`;
    if(fd.professionalNarrative){
      content += `PROFESSIONAL NARRATIVE\n${'-'.repeat(30)}\n${fd.professionalNarrative}\n\n`;
    }
    content += `INCIDENT NARRATIVE\n${'-'.repeat(30)}\n${fd.incidentDescription||'N/A'}\n\n`;
    content += `Guest Statement: ${fd.guestStatement||'N/A'}\n`;
    content += `Witnesses: ${fd.witnesses||'None'}\nAction Taken: ${fd.actionTaken||'N/A'}\n`;
    content += `EMS/Police: ${fd.emsPolice||'N/A'}\nGuest Transported: ${fd.guestTransported||'N/A'}\n\n`;
    content += `FOLLOW-UP\n${'-'.repeat(30)}\n`;
    content += `Required: ${fd.followUp||'N/A'}\nDetails: ${fd.followUpDetails||'N/A'}\n\n`;
  } else {
    const empName=`${fd.employeeFirstName||''} ${fd.employeeLastName||''}`.trim();
    content += `RECOGNITION DETAILS\n${'-'.repeat(30)}\n`;
    content += `Employee: ${empName}\nRole: ${fd.employeeRole||'N/A'}\n\n`;
    content += `Description:\n${fd.recognitionDescription||'N/A'}\n\n`;
    content += `Impact & S.A.F.E. Values:\n${fd.recognitionImpact||'N/A'}\n\n`;
  }
  content += `Additional Comments: ${fd.additionalComments||'None'}\n\n`;
  content += `${'='.repeat(50)}\n`;
  content += `Supervisor: ${supName}     Date: ${fd.date||''}\n\n`;
  content += `Signature: _______________________\n\n`;
  content += `Physical description provided for identification purposes only.\nThis report is confidential and intended solely for S.A.F.E. Management and Ford Field HR review.\n`;

  // Convert to RTF for proper Word formatting
  const esc = s => (s||'N/A').replace(/[\\{}]/g,'\\$&').replace(/\n/g,'\\par ');
  const rtfField = (lbl,val) => '{\\pard\\sb40{\\b '+esc(lbl)+': }'+esc(val||'N/A')+'\\par}';
  const rtfHead = s => '{\\pard\\sb180\\sa60\\b\\fs24\\cf1 '+esc(s)+'\\par}';
  const rtfDiv = '{\\pard\\brdrb\\brdrs\\brdrw6 \\par}';

  let rtf = '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Arial;}}{\\colortbl;\\red26\\green46\\blue74;\\red232\\green25\\blue44;}\\f0\\fs22\\paperw12240\\paperh15840\\margl1440\\margr1440\\margt1440\\margb1440';
  rtf += '{\\pard\\qc\\b\\fs32\\cf1 S.A.F.E. MANAGEMENT\\par}';
  rtf += '{\\pard\\qc\\b\\fs26\\cf2 '+(isIncident?'INCIDENT REPORT':'EMPLOYEE RECOGNITION REPORT')+'\\par}';
  rtf += '{\\pard\\qc\\fs18 Submission ID: '+submissionId+' | Filed: '+esc(content.split('\n')[2].replace('Filed: ',''))+'\\par}';
  rtf += rtfDiv;
  // Re-use the plain text content, converting line by line
  content.split('\n').forEach(line => {
    if(line.startsWith('===')) { rtf += rtfDiv; }
    else if(line.match(/^[A-Z &]+$/)) { rtf += rtfHead(line); }
    else if(line.startsWith('---')) { /* skip */ }
    else if(line.includes(': ')) { const [lbl,...rest]=line.split(': '); rtf += rtfField(lbl, rest.join(': ')); }
    else if(line.trim()) { rtf += '{\\pard\\sb20 '+esc(line)+'\\par}'; }
  });
  rtf += '}';

  const blob = new Blob([rtf], {type:'application/rtf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'SAFE_'+(isIncident?'Incident':'Recognition')+'_Report_'+submissionId+'.doc';
  a.click();
  URL.revokeObjectURL(url);
}

function ff(label,value,key){
  const val=value||'Unknown / Not Available';
  const cls=(!value||value==='Unknown / Not Available')?'unknown':'';
  const editInput=key?`<textarea class="field-value-edit editable-input" data-key="${key}" style="display:none">${val}</textarea>`:'';
  const spanClass=key?'editable-value':'';
  return `<div class="form-field"><label>${label}</label><span class="${cls} ${spanClass}">${val}</span>${editInput}</div>`;
}

// ── UTILS ──────────────────────────────────────────────────────────────────
function delay(ms){return new Promise(r=>setTimeout(r,ms));}

let sendInterceptor = null; // custom one-shot handler

async function handleSend(){
  const raw=userInput.value.trim();
  console.log('handleSend called — raw:', raw.slice(0,50), '| awaitingInput:', awaitingInput, '| interceptor:', !!sendInterceptor);
  if(!raw||!awaitingInput)return;
  userInput.value=''; userInput.style.height='auto';
  if(sendInterceptor){
    const fn = sendInterceptor;
    sendInterceptor = null;
    clearQuickReplies(); addBubble(raw,'user');
    await fn(raw);
    return;
  }
  clearQuickReplies(); addBubble(raw,'user');
  await processAnswer(raw);
}

userInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}});
userInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px';});

  const card=document.createElement('div'); card.className='welcome-card';
  card.innerHTML=`

    <button class="voice-btn" id="voiceToggle" onclick="toggleVoice()">🔇 Voice Off — Tap to Hear Questions Read Aloud</button>    <button class="start-btn" onclick="startFlow()">▶ Start Report</button>`;
